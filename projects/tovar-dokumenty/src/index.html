const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:p=>p,
  out:p=>1-Math.pow(1-p,3),
  in:p=>p*p*p,
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  outQ:p=>1-Math.pow(1-p,5),
  outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),
  inExpo:p=>p<=0?0:Math.pow(2,10*p-10),
  back:p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  spring:p=>p>=1?1:1-Math.exp(-6.5*p)*Math.cos(10*p),
  soft:p=>p>=1?1:1-Math.exp(-5*p)*Math.cos(6*p),
};
function mixObj(a,b,p){const o={};for(const k in b){const va=a[k]??b[k];o[k]=typeof b[k]==='number'?lerp(va,b[k],p):(p<.5?va:b[k]);}for(const k in a)if(!(k in o))o[k]=a[k];return o}
// keyframes: [[time, value, ease?], ...]; ease applies to the segment ending at that key
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){
    const [t1,v1,e]=keys[i];
    if(t<=t1){const [t0,v0]=keys[i-1];const p=(E[e||'io'])(prog(t,t0,t1));
      return typeof v1==='number'?lerp(v0,v1,p):mixObj(v0,v1,p)}
  }
  return keys[keys.length-1][1];
}

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixHex(a,b,p){const A=hex2rgb(a),B=hex2rgb(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')})`}

});

function palette(t){
  let k=0;while(k<SB.length-2&&t>=SB[k+1])k++;
  let a=PAL[k],b=PAL[k],p=0;
  const next=SB[k+1],prev=SB[k];
  if(k<PAL.length-1&&t>next-.35){b=PAL[k+1];p=E.io(prog(t,next-.35,next+.35))}
  else if(k>0&&t<prev+.35){a=PAL[k-1];b=PAL[k];p=E.io(prog(t,prev-.35,prev+.35))}
  return a.map((c,i)=>mixHex(c,b[i],p));
}
