<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как быстро ты читаешь — RU</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f1f2f6}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#111218}
.abs{position:absolute}
.mono{font-family:'DejaVu Sans Mono',monospace}
.ctr{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:rgba(255,255,255,.92);border:1.5px solid #fff;box-shadow:0 12px 26px -14px rgba(40,50,110,.3);transform:translate(-50%,-50%)}
.card{position:absolute;border-radius:46px;background:#fff;box-shadow:0 46px 90px -40px rgba(40,50,110,.4),0 10px 24px -12px rgba(40,50,110,.14)}
.chip{display:inline-block;padding:10px 26px;border-radius:999px;background:#2f7bf5;color:#fff;font-weight:800;box-shadow:0 14px 26px -12px rgba(47,123,245,.6)}
#word{position:absolute;left:0;top:0;white-space:pre;font-weight:700;font-kerning:normal;line-height:1;letter-spacing:-.01em}
#word .r{color:#C43D3D}
</style>
</head>
<body>
<div id="root" class="abs" style="inset:0">
 
 
 
 <!-- counter pill: level + four slashes as the progress -->
 <div id="cnt" class="pill" style="left:540px;top:150px;height:70px;padding:0 30px;gap:20px;font-weight:800;font-size:31px;letter-spacing:.04em"><span id="level"></span><span id="prog" class="mono" style="font-size:37px;letter-spacing:-.04em;font-weight:700"></span></div>
 <div id="title" class="ctr" style="left:540px;top:400px;font-weight:900;font-size:87px;letter-spacing:-.045em;line-height:.95">Как быстро<br>ты <span style="color:#2f7bf5">читаешь?</span></div>
 <!-- reading window card with the two guides and ticks on the fixation axis -->
 <div class="card" style="left:60px;top:740px;width:960px;height:370px"></div>
 <div class="abs" style="left:110px;top:810px;width:860px;height:2px;background:#e3e6ee"></div>
 <div class="abs" style="left:110px;top:1040px;width:860px;height:2px;background:#e3e6ee"></div>
 <div class="abs" style="left:478px;top:796px;width:4px;height:30px;border-radius:2px;background:#2f7bf5;opacity:.55"></div>
 <div class="abs" style="left:478px;top:1026px;width:4px;height:30px;border-radius:2px;background:#2f7bf5;opacity:.55"></div>
 <div id="word"></div>
 <div id="speed" class="abs" style="left:0;top:0">
  <div id="sp_hl" class="abs" style="left:0;top:1160px;height:76px;border-radius:999px;background:#2f7bf5;box-shadow:0 14px 26px -12px rgba(47,123,245,.6)"></div>
  <div id="sp_row" class="abs" style="left:0;top:1160px;height:76px"></div>
  <div id="sp_u" class="ctr" style="left:480px;top:1276px;font-weight:700;font-size:29px;letter-spacing:.08em;color:#8a90a6">СЛОВ В МИНУТУ</div>
 </div>
 <!-- result card -->
 <div id="rc" class="card" style="left:60px;top:1240px;width:960px;height:430px"></div>
 <div id="q" class="ctr" style="left:540px;top:950px;font-weight:900;font-size:65px;letter-spacing:-.035em;line-height:1.02;text-align:center">На какой скорости<br><span style="color:#2f7bf5">стало трудно?</span></div>
 <div id="nums" class="abs" style="left:540px;top:1330px;transform:translateX(-50%);display:flex;gap:16px;font-size:55px">
   <span class="chip">250</span><span class="chip">375</span><span class="chip">500</span><span class="chip">750</span></div>
 <div id="cta" class="ctr" style="left:540px;top:1500px;font-weight:800;font-size:47px;letter-spacing:-.01em">Напиши в комментариях</div>
 <div id="like" class="ctr" style="left:540px;top:1578px;font-weight:700;font-size:33px;letter-spacing:.06em;color:#8a90a6">ДОШЁЛ ДО КОНЦА? СТАВЬ ЛАЙК</div>
</div>
<script src="text_ru.js"></script>
<script>
'use strict';
// ═══════════ Чтение с ускорением (RU): RSVP, one word at a time, red letter locked to x = 480 / baseline y = 960 ═══════════
const FPS=60,NFR=8122,DUR=NFR/FPS,AX=480,BASE=960,RED='#C43D3D';
const SECS=[ // ideal grid (seconds), words per minute, music BPM
 {key:'intro',t0:0,     wpm:125,bpm:62.5, label:'4 УРОВНЯ',      speed:''},
 {key:'l1',   t0:7.68,  wpm:250,bpm:62.5, label:'УРОВЕНЬ 1 ИЗ 4',speed:'250 слов/мин'},
 {key:'l2',   t0:38.4,  wpm:375,bpm:93.75,label:'УРОВЕНЬ 2 ИЗ 4',speed:'375 слов/мин'},
 {key:'l3',   t0:69.12, wpm:500,bpm:125,  label:'УРОВЕНЬ 3 ИЗ 4',speed:'500 слов/мин'},
 {key:'l4',   t0:99.84, wpm:750,bpm:187.5,label:'УРОВЕНЬ 4 ИЗ 4',speed:'750 слов/мин'},
];
const FIN_T=130.56;
const fr=t=>Math.floor(t*FPS+.5);                 // ideal time → frame (never round per-word durations)
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const $=id=>document.getElementById(id);
// ───────── event table: every word's start frame from the exact formula
const EV=[];SECS.forEach((s,si)=>TEXT[s.key].forEach((w,i)=>EV.push({w,si,i,f:fr(s.t0+i*60/s.wpm)})));
const SEC_F=SECS.map(s=>fr(s.t0)),FIN_F=fr(FIN_T);
// ───────── red-letter rule: count letters without quotes/punctuation; 1→1st, 2–5→2nd, 6–9→3rd, 10–13→4th, 14+→5th
const isL=c=>/[\p{L}\p{N}]/u.test(c);
function redIndex(w){const idx=[];[...w].forEach((c,k)=>{if(isL(c))idx.push(k)});const n=idx.length;if(!n)return -1;
  const pick=n===1?1:n<=5?2:n<=9?3:n<=13?4:5;return idx[Math.min(pick,n)-1]}
// ───────── layout: measure the real font with kerning, one size for the whole version
const WORD=$('word');let SIZE=100;const LAY=new Map();
function measure(w,size){const ri=redIndex(w),ch=[...w];WORD.style.fontSize=size+'px';
  WORD.innerHTML=ch.map((c,k)=>k===ri?`<span class="r">${c}</span>`:c.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('');
  WORD.style.transform='translate(0px,0px)';const wb=WORD.getBoundingClientRect();
  const r=WORD.querySelector('.r');let cx=wb.width/2;if(r){const rb=r.getBoundingClientRect();cx=rb.left-wb.left+rb.width/2}
  // kerning check: the coloured span must not change the advance of the whole word
  WORD.textContent=w;const w2=WORD.getBoundingClientRect().width;return {cx,width:wb.width,kernOk:Math.abs(w2-wb.width)<.5,ri}}
function layoutAll(){const words=[...new Set(EV.map(e=>e.w))];let s=SIZE;
  // largest single size that keeps every word inside x = 90…900 with its red letter on x = 480
  for(const w of words){const m=measure(w,100);const left=m.cx,right=m.width-m.cx;s=Math.min(s,100*Math.min((AX-90)/left,(900-AX)/right))}
  SIZE=Math.floor(Math.min(110,s));let bad=0;
  for(const w of words){const m=measure(w,SIZE);if(!m.kernOk)bad++;LAY.set(w,m)}
  // baseline: place the line box so the alphabetic baseline sits on y = 960
  WORD.style.fontSize=SIZE+'px';WORD.innerHTML='Hxg<span id="bl" style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
  const top=WORD.getBoundingClientRect().top,bl=$('bl').getBoundingClientRect().top;window.BASE_OFF=bl-top;window.KERN_BAD=bad;window.FONT_SIZE=SIZE}
function showWord(w){const m=LAY.get(w);const ch=[...w];
  WORD.innerHTML=ch.map((c,k)=>k===m.ri?`<span class="r">${c}</span>`:c).join('');
  WORD.style.transform=`translate(${(AX-m.cx).toFixed(2)}px,${(BASE-window.BASE_OFF).toFixed(2)}px)`;WORD.style.visibility='visible'}
// progress: four static segments centred on the fixation axis
$('prog').innerHTML=[0,1,2,3].map(()=>'<span style="font-style:italic">/</span>').join('');const SEG=[...$('prog').children];
// speed row: four values, the current one sharp in a blue pill, the rest blurred
const SPV=[250,375,500,750],SPW=150,SPG=18,SPX=AX-(4*SPW+3*SPG)/2;
const SPC=SPV.map((v,k)=>{const d=document.createElement('div');d.className='abs';d.style.cssText=`left:${SPX+k*(SPW+SPG)}px;top:0;width:${SPW}px;height:76px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:47px;letter-spacing:-.01em;transform-origin:50% 50%`;d.textContent=v;$('sp_row').appendChild(d);return d});
const lerpPop=p=>.9+.1*p;const eo=p=>1-Math.pow(1-p,3),eb=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function renderSpeed(f,si,fin){const lvl=fin?3:si-1;const T=21;   // ≈0.35 s transition starting on the level's first frame
  const q=si>=2&&!fin?clamp((f-SEC_F[si])/T):1;const from=si>=2&&!fin?lvl-1:lvl;
  const pos=lvl<0?-1:from+(lvl-from)*eo(q);
  const q1=si===1?clamp((f-SEC_F[1])/T):1;   // level 1: the pill appears out of the blur
  const hl=$('sp_hl');if(lvl<0){hl.style.opacity=0}else{hl.style.opacity=q1;hl.style.left=SPX+pos*(SPW+SPG)+'px';hl.style.width=SPW+'px';hl.style.transform=si===1?`scale(${.6+.4*eb(q1)})`:`scaleX(${1+.18*Math.sin(Math.PI*q)})`}
  SPC.forEach((c,k)=>{const on=lvl<0?0:clamp(1-Math.abs(pos-k))*q1;   // how much of the blue pill covers this value
    const g=Math.round(154+(255-154)*on),gb=Math.round(160+(255-160)*on),bb=Math.round(180+(255-180)*on);c.style.color=`rgb(${g},${gb},${bb})`;
    c.style.filter=on>.98?'none':`blur(${(1-on)*3.2}px)`;c.style.opacity=.45+.55*on;const pop=k===lvl&&q<1?eb(q):1;c.style.transform=`scale(${(.92+.16*on)*(k===lvl?lerpPop(pop):1)})`});
  vis($('sp_u'),lvl<0?0:1)}
const vis=(el,o)=>{el.style.opacity=o;el.style.visibility=o<=.004?'hidden':'visible'};

function renderAt(t){
  const f=Math.min(NFR-1,Math.round(t*FPS));
  // current section and word (each word holds until the next event; the last one until the next section)
  let si=0;while(si<SECS.length-1&&f>=SEC_F[si+1])si++;const fin=f>=FIN_F;
  let lo=0,hi=EV.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(EV[m].f<=f)lo=m;else hi=m-1}
  if(fin)WORD.style.visibility='hidden';else showWord(EV[lo].w);
  // labels: level/indicator changes on the first word of the level; speed may fade in over 6 frames
  const s=SECS[si];$('level').textContent=s.label;renderSpeed(f,si,fin);
  vis($('level'),1);if(fin)$('level').textContent='ГОТОВО';vis($('speed'),fin?0:1);
  SEG.forEach((g,k)=>{g.style.color=(si>=1&&k<si)||fin?'#2f7bf5':'#c6cbdb'});
  // result card: static; last 0.3 s fade back to the clean opening state
  const out=clamp((f-(NFR-18))/18);const card=fin?1-out:0;['q','nums','cta','like','rc'].forEach(id=>vis($(id),card));
  if(fin&&out>0){SEG.forEach(g=>{g.style.color='#c6cbdb'});$('level').textContent=SECS[0].label}
}

// ───────── sound events (frame-exact: sample = frame × 800 at 48 kHz)
const SFX=[];const sx=(f,type,g=1,extra)=>SFX.push(Object.assign({t:+(f/FPS).toFixed(6),f,type,g,pan:0},extra||{}));
EV.forEach(e=>sx(e.f,'tick',[.55,.5,.42,.32,.26][e.si],{sec:e.si}));
[2,3,4].forEach(k=>sx(SEC_F[k],'accent',.5,{n:k}));sx(FIN_F,'end',.6);
window.SFX=SFX;window.renderAt=renderAt;window.DUR=DUR;window.SCN=SECS.map((s,k)=>({t0:SEC_F[k]/FPS,bpm:s.bpm,wpm:s.wpm,f0:SEC_F[k]})).concat([{t0:FIN_F/FPS,bpm:62.5,f0:FIN_F}]);
window.EVT=EV.map(e=>[e.f,e.w]);
document.fonts.load('700 100px "Inter Display"','АБВабвёЁ—?').then(()=>document.fonts.ready).then(()=>{layoutAll();renderAt(0);window.ready=true});
</script>
</body>
</html>
