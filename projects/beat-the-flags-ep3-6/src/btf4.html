// sprites
const SRC=k=>BM4[k]?['balls4',BM4[k]]:BM2[k]?['balls2',BM2[k]]:['balls',BM[k]];const IMGC=[];Object.keys(BM4).concat(Object.keys(BM2)).concat(['white_02','white_05','white_06','white_09','white_10','white_14','white_15','white_16','white_17','white_18','white_19','white_20','white_21']).forEach(k=>{const [d]=SRC(k);const i=new Image();i.src=`${d}/${k}.png`;IMGC.push(i)});
function put(el,k,D=236){const [d,m]=SRC(k),kk=D/Math.max(m.w,m.h*.98),w=m.w*kk,h=m.h*kk;if(el.dataset.k!==k){el.src=`${d}/${k}.png`;el.dataset.k=k}el.style.cssText=`position:absolute;width:${w}px;left:${-w/2}px;top:${118-h}px`;return h}

    return `<span style="display:inline-block;color:rgb(${col});opacity:${Math.min(1,p*1.6)};filter:blur(${((1-p)*8+ex*5).toFixed(2)}px);transform:translateY(${((1-p)*16).toFixed(1)}px);${w.key?'font-weight:800':''}">${w.txt}</span>`}).join(' ')}

// ───────── card transform for the active round
function cardState(t){
  let r=null;for(const x of RD)if(t>=x.in0&&t<x.out1+(x===RD[8]?99:0))r=x;if(!r)return null;
  let tx=0,ty=0,sc=1,rot=0,ry=0,origin='50% 50%',op=1,back=false;
  if(t<r.S+.05){const u=eio(seg(t,r.in0,r.S+.05));
    if(r.enter==='rise'){ty=lerp(560,0,eo(u));sc=lerp(.25,1,eb(seg(t,r.in0,r.S+.05)));op=clamp(u*4)}
    if(r.enter==='right'){tx=lerp(1150,0,u);rot=lerp(10,0,u)}
    if(r.enter==='up'){ty=lerp(1200,0,u)}
    if(r.enter==='flip'||r.enter==='slowflip'){ry=lerp(180,0,u);back=ry>90;sc=lerp(.9,1,u)}
    if(r.enter==='book'){ry=lerp(-110,0,eo(u));origin='0% 50%';back=ry<-90;op=clamp(u*3)}}
  if(r===RD[3]&&t>=r.E+.05&&t<44.15){const u=eio(seg(t,r.E+.05,r.E+.6));sc=lerp(1,.78,u);op=lerp(1,.25,u);ty=-40*u}
  if(r!==RD[8]&&t>=r.out0){const u=eio(seg(t,r.out0,r.out1));const sx0=r===RD[3]?.78:1;tx=lerp(0,STX-CX,u);ty=lerp(r===RD[3]?-40:0,STY-CYc-60,u);sc=lerp(sx0,.18,u);rot=lerp(0,-8+((RD.indexOf(r))%3)*5,u);op=r===RD[3]?lerp(.25,1,seg(u,0,.3)):1;if(u>=1)return null}
  if(r===RD[8]&&t>=95.6){const u=eio(seg(t,95.6,96.3));ry=lerp(0,180,u);back=ry>90;sc=lerp(1,.62,eio(seg(t,96.1,97.2)))}
  return {r,tx,ty,sc,rot,ry,origin,op,back}}
function stackCount(t){return RD.filter(x=>x!==RD[8]&&t>=x.out1).length}

// ───────── ball
const HOP=[['white_14',.06],['white_15',.07],['white_16',.08],['white_17',.12],['white_18',.12],['white_19',.08],['white_20',.07],['white_21',.08]];
const seq=(t,t0,list)=>{let a=t0;for(const [k,d] of list){if(t<a+d)return k;a+=d}return list[list.length-1][0]};
const BLINKS=[];for(let b=2.1;b<96;b+=2.8)BLINKS.push(b);
function ballState(t){let white='W1',flag=null,sweep=0,dy=0,rot=0,dx=0,sx=1,sy=1;
  if(t<1.3){white=t<.9?'W3':'W4'}else if(t<4.6){white=t<2.6?'W1':t<3.6?'W2':'W1'}
  // follow card motions
  RD.forEach((r,i)=>{if(t>=r.in0&&t<r.S){white=r.enter==='right'?'W4':r.enter==='up'?'W5':'W1'}if(i!==8&&t>=r.out0&&t<r.out1)white='W3'});
  // unlock plates
  UNLOCK.forEach(([a,b,lv])=>{if(t>=a&&t<b-.8)white=lv>=2?'W6':'W1'});
  if(t>=5.3&&t<5.98){white=seq(t,5.3,HOP);dy=-46*Math.sin(seg(t,5.42,5.88)*Math.PI)}
  if(t>=5.98&&t<7.0){white='white_05';rot+=7*Math.sin(seg(t,6.1,6.4)*Math.PI)}
  const cur=RD.find(r=>t>=r.S&&t<r.E+.4);
  if(cur){const e=t-cur.T0;
    if(t>=cur.T0&&t<cur.R){white='W1';if(cur.lv>=2&&e>1.5&&e<3.5)white='W6';if(cur===RD[3])white=e<2.5?'W2':'W1';if(cur===RD[5])white=e<2.2?'W2':'W1';if(cur===RD[2])white='W6';if(cur===RD[6]){white='W6';rot+=5*Math.sin(seg(e,0,.5)*Math.PI/2)}if(cur===RD[7]||cur===RD[8])rot+=4;
      if(cur===RD[1]&&e>3.5){white='W6';rot+=5}if(cur===RD[8]&&e>2.6)white='white_09';if(cur===RD[8]&&e>4.4)white='white_05'}
    if(t>=cur.R){const r=t-cur.R;white='white_05';
      if(cur.name){flag=cur.f+'_A';sweep=eio(seg(r,0,.2))*(1-eio(seg(t,cur.E,cur.E+.35)));
        if(r>.2&&r<1.0)flag=seq(r,.2,cur.react.map(([a,d])=>[cur.f+'_'+a,d]));
        if(cur===RD[1]&&r>.2&&r<.6)dy=-34*Math.sin(seg(r,.2,.52)*Math.PI);if(cur===RD[5]&&r>.3)rot+=-6*Math.sin(seg(r,.3,.8)*Math.PI);if(cur===RD[7]&&r>.2)rot+=-3*seg(r,.2,.5);
        if(r<.32){const k=.07*Math.sin(seg(r,0,.32)*Math.PI);sx+=k;sy-=k}}}}
  if(t>=40.8&&t<44.2){white='white_05';rot+=7*Math.sin(seg(t,42.3,42.6)*Math.PI)}
  if(t>=89.3&&t<95.6)white=t<92.5?'white_05':t<94?'W4':'white_05';
  if(white==='W1'&&!flag&&BLINKS.some(b=>t>=b&&t<b+.1))white='white_02';
  return {white,flag,sweep,dy,rot,dx,sx,sy}}

function badges(t){BADGES.innerHTML=LV.map(([nm,c],i)=>{const u=UNLOCK.find(x=>x[2]===i);const on=t>=u[0]+.25;const shake=t>=u[0]&&t<u[0]+.25?Math.sin((t-u[0])*60)*4:0;const pop=on?eb(seg(t,u[0]+.25,u[0]+.55)):0;
  return `<div style="height:62px;padding:0 18px 0 14px;border-radius:999px;background:${on?'#fff':'rgba(255,255,255,.18)'};display:flex;align-items:center;gap:8px;color:${on?c:'rgba(255,255,255,.75)'};font-weight:900;font-size:21px;letter-spacing:.05em;transform:translateX(${shake.toFixed(1)}px) scale(${on?(.85+.15*pop).toFixed(3):1});box-shadow:${on?'0 10px 24px -12px rgba(0,0,0,.5)':'none'}">${on?`<span style="width:14px;height:14px;border-radius:50%;background:${c};box-shadow:0 0 10px ${c}"></span>`:lockI(0)}<span style="color:${on?(c==='#f2b705'?'#c99400':c):'rgba(255,255,255,.75)'}">${nm}</span></div>`}).join('')}
