const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eb=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};   // ease-out-back (overshoot)
const bounce=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375};
const mk=(parent,h)=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;$(parent).appendChild(e);return e};

// ───────── places (real coordinates) and the story schedule from the storyboard

const NAMES={aogashima:'AOGASHIMA',kishi:'KISHI STATION',zao:'ZAO MOUNTAINS',susami:'SUSAMI'};

 {k:'aogashima',fly:[21,23],open:[23,25],close:[35.5,36.4],back:[36.4,38]},
 {k:'kishi',fly:[38,40],open:[40,42],close:[53,53.9],back:[53.9,55]},
 {k:'zao',fly:[55,57],open:[57,59],close:[70,70.9],back:[70.9,72]},
 {k:'susami',fly:[72,74],open:[74,76],close:[85.5,86.2],back:[86.2,87]}];
const VO=[[.25,4.75,'A cat stationmaster. A volcano inside a volcano. Welcome to Japan.'],
 [6,19,'Japan’s official island count, published in twenty twenty-three, was fourteen thousand, one hundred and twenty-five. Better mapping changed the count. The country didn’t suddenly grow.'],
 [23.5,35.5,'Aogashima looks like a tiny green island. Look closer: a smaller volcanic cone sits inside a much larger caldera. It’s a volcano inside a volcano—and people live on the island.'],
 [40.8,53,'In two thousand seven, Kishi Station gave a cat named Tama the title of stationmaster. She greeted passengers and became the railway’s famous mascot. Visitors came just to meet her.'],

 [74,85.2,'And in Susami, you can post a postcard underwater. About ten metres down, a red mailbox stands on the seabed. Special postcards go in, and are collected for delivery.'],

const JB=mk('ui',`<div class="abs" style="left:205px;top:1385px;width:0;height:0"><div id="jbsh" class="abs" style="left:-100px;top:118px;width:200px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))"></div><div id="jbb" class="abs" style="left:0;top:0;width:0;height:0"></div><svg id="jbfx" class="abs" style="left:-200px;top:-260px;overflow:visible" width="400" height="400"></svg></div>`);

const SUB=mk('ui',`<div class="abs" style="left:540px;top:1610px;transform:translate(-50%,-50%);padding:16px 36px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 16px 34px -16px rgba(10,20,40,.55);font-weight:700;font-size:40px;text-align:center;white-space:nowrap"></div>`);
const ICONS=mk('ui',`<div class="abs" style="left:540px;top:860px;transform:translate(-50%,-50%);display:flex;gap:22px">${ART.icons.map((s,i)=>`<div class="ic" style="display:flex;flex-direction:column;align-items:center;gap:12px"><div style="width:156px;height:156px;border-radius:44px;background:#fff;box-shadow:0 18px 36px -16px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center"><svg width="104" height="104" viewBox="0 0 100 100">${s}</svg></div><div style="width:56px;height:56px;border-radius:50%;background:${BLUE};color:#fff;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center">${i+1}</div></div>`).join('')}</div>`);
const SCALE=mk('ui',`<div class="abs" style="left:930px;top:560px;width:0;height:600px"><svg width="70" height="620" style="position:absolute;left:-35px;top:0" viewBox="-35 0 70 620"><path id="scl" d="M0 20 V600" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="580" stroke-dashoffset="580"/>${[...Array(11)].map((_,i)=>`<path class="stk" d="M-10 ${20+i*58} H10" stroke="#fff" stroke-width="${i%5?3:5}" stroke-linecap="round"/>`).join('')}</svg>
 <div id="sc0" class="pill" style="left:0;top:20px;height:40px;padding:0 14px;font-weight:900;font-size:22px">0 m</div><div id="sc1" class="pill" style="left:0;top:600px;height:40px;padding:0 14px;font-weight:900;font-size:24px;color:${BLUE}">10 m</div></div>`);
const pillT=(el,o,s=1,dy=0)=>{el.style.transform=`translate(-50%,-50%) translateY(${dy}px) scale(${s})`;vis(el,o)};

// kinetic word builder: every word rises out of a blur with a stagger; key words overshoot
function kin(lines,t,t0){let k=0;return lines.map(([txt,fs,col,extra=''])=>`<div style="font-weight:900;font-size:${fs}px;line-height:1.08;letter-spacing:-.01em;color:${col};white-space:nowrap;${extra}">`+txt.split(' ').map(w=>{const p=clamp((t-t0-k*.07)/.38);k++;const s=.7+.3*eb(p);
  return `<span style="display:inline-block;margin:0 .12em;opacity:${Math.min(1,p*2).toFixed(3)};transform:translateY(${((1-eo(p))*26).toFixed(1)}px) scale(${s.toFixed(3)});filter:blur(${((1-p)*6).toFixed(2)}px)">${w}</span>`}).join('')+'</div>').join('')}
const typeOn=(txt,t,t0,cps=26)=>{const n=Math.floor(clamp((t-t0)*cps,0,txt.length));return txt.slice(0,n)+(n<txt.length&&n>0?'<span style="opacity:.5">|</span>':'')};

// kinetic subtitles
const WORDS=[];VO.forEach(([a,b,txt],li)=>{const ws=txt.split(' '),wt=ws.map(w=>w.length+3),T=wt.reduce((s,v)=>s+v,0);let t=a;ws.forEach((w,i)=>{WORDS.push({txt:w,t,li,key:KEY.test(w)});t+=(b-a)*wt[i]/T})});
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1],len=cur.reduce((s,x)=>s+x.txt.length+1,0);if(/[.?!:—]$/.test(w.txt)||len>=30||!nx||nx.li!==w.li){CH.push(cur);cur=[]}})}
CH.forEach((c,i)=>{const nx=CH[i+1];c.t0=c[0].t;c.t1=nx&&nx[0].li===c[0].li?nx[0].t-.02:VO[c[0].li][1]+.35});
const lc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),LB=[157,182,234],NV=[43,58,103],BK=[17,18,24],BLc=[47,123,245],GR=[150,156,170];
function renderSub(t){const c=CH.find(c=>t>=c.t0-.01&&t<c.t1+.15);if(!c){vis(SUB,0);return}const ex=clamp((t-c.t1)/.15),inn=eb(clamp((t-c.t0)/.2));vis(SUB,1-ex*.9);SUB.style.transform=`translate(-50%,-50%) scale(${(.92+.08*inn).toFixed(3)})`;
  SUB.innerHTML=c.filter(w=>t>=w.t).map(w=>{const p=clamp((t-w.t)/.28),q=clamp((t-w.t-.28)/.25);let col=w.key?lc(LB,BLc,p):p<1?lc(LB,NV,p):lc(NV,BK,q);if(ex>0)col=lc(col,GR,ex);const s=w.key?(.6+.4*eb(p))*1.06:1;
    return `<span style="display:inline-block;margin:0 ${w.key?'.24em':'.1em'};color:rgb(${col});opacity:${Math.min(1,p*1.6)};filter:blur(${((1-p)*8+ex*5).toFixed(2)}px);transform:translateY(${((1-p)*18).toFixed(1)}px) scale(${s.toFixed(3)});${w.key?'font-weight:900':''}">${w.txt}</span>`}).join(' ')}

// ───────── globe (WebGL orthographic, NASA Blue Marble) + Natural Earth borders; Japan highlight in the house style
const GL=$('glc').getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform sampler2D tex;uniform sampler2D det;uniform vec2 C;uniform float R;uniform vec2 L;
uniform vec3 DG;uniform vec2 DS;uniform float DON;
void main(){vec2 q=(gl_FragCoord.xy-C)/R;float r2=dot(q,q);vec3 bg=vec3(.024,.094,.165);
  if(r2>1.){float d=sqrt(r2)-1.;float g=exp(-d*R/38.)*.55+exp(-d*R/140.)*.18;gl_FragColor=vec4(bg+vec3(.35,.6,1.)*g,1.);return;}
  vec3 v=vec3(q.x,q.y,sqrt(1.-r2));float cl=cos(L.y),sl=sin(L.y);vec3 w=vec3(v.x,v.y*cl+v.z*sl,-v.y*sl+v.z*cl);
  float lon=atan(w.x,w.z)+L.x,lat=asin(clamp(w.y,-1.,1.));float fx=fract(lon/6.2831853+.5);vec2 uv=vec2(fx,.5-lat/3.1415927);
  vec3 c=texture2D(tex,uv).rgb;
  if(DON>0.){float ym=log(tan(.78539816+clamp(lat,-1.47,1.47)*.5));vec2 d=vec2((fx*DG.x-DG.y)/DS.x,((1.-ym/3.1415927)*.5*DG.x-DG.z)/DS.y);
    float wg=smoothstep(0.,.03,d.x)*smoothstep(0.,.03,1.-d.x)*smoothstep(0.,.03,d.y)*smoothstep(0.,.03,1.-d.y);c=mix(c,texture2D(det,d).rgb,wg*DON);}
  c*=1.08;float limb=pow(v.z,.35);c=c*(.55+.45*limb)+vec3(.3,.55,1.)*pow(1.-v.z,3.)*.55;gl_FragColor=vec4(c,1.);}`;
const sh=(t,src)=>{const o=GL.createShader(t);GL.shaderSource(o,src);GL.compileShader(o);if(!GL.getShaderParameter(o,GL.COMPILE_STATUS))throw new Error(GL.getShaderInfoLog(o));return o};
const PG=GL.createProgram();GL.attachShader(PG,sh(GL.VERTEX_SHADER,VS));GL.attachShader(PG,sh(GL.FRAGMENT_SHADER,FS));GL.linkProgram(PG);GL.useProgram(PG);
GL.bindBuffer(GL.ARRAY_BUFFER,GL.createBuffer());GL.bufferData(GL.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),GL.STATIC_DRAW);
const aP=GL.getAttribLocation(PG,'p');GL.enableVertexAttribArray(aP);GL.vertexAttribPointer(aP,2,GL.FLOAT,false,0,0);
const U={};['C','R','L','DG','DS','DON','tex','det'].forEach(n=>U[n]=GL.getUniformLocation(PG,n));GL.uniform1i(U.tex,0);GL.uniform1i(U.det,1);
const TEX=new Image();TEX.src=GLOBE_SRC;
TEX.onload=()=>{GL.activeTexture(GL.TEXTURE0);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,TEX);
  [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE))};
const DETIMG={},DETTEX={};Object.keys(DET_SRC).forEach(k=>{const im=new Image();im.src=DET_SRC[k];DETIMG[k]=im});
function bindDet(k){if(!k){GL.uniform1f(U.DON,0);return}
  if(!DETTEX[k]){GL.activeTexture(GL.TEXTURE1);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,DETIMG[k]);
    [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE));DETTEX[k]=t}
  GL.activeTexture(GL.TEXTURE1);GL.bindTexture(GL.TEXTURE_2D,DETTEX[k]);GL.activeTexture(GL.TEXTURE0);
  const r=DET_REF[k];GL.uniform3f(U.DG,256*2**r.z,r.X0*256,r.Y0*256);GL.uniform2f(U.DS,r.W,r.H);GL.uniform1f(U.DON,1)}
const C10=topojson.feature(WORLD10,WORLD10.objects.countries).features,C50=topojson.feature(WORLD50,WORLD50.objects.countries).features;
const JP10=C10.find(c=>c.id==='392'),JP50=C50.find(c=>c.id==='392');
const MESH10=topojson.mesh(WORLD10,WORLD10.objects.countries,(a,b)=>a!==b),MESH50=topojson.mesh(WORLD50,WORLD50.objects.countries,(a,b)=>a!==b);
const GPR=d3.geoOrthographic().clipAngle(90).precision(.3),GPATH=d3.geoPath(GPR);
// camera views: fit a lon/lat box into a screen rect
function fit(lo0,lo1,la0,la1,rect){const pts=[];for(let i=0;i<=24;i++){const f=i/24;pts.push([lerp(lo0,lo1,f),la0],[lerp(lo0,lo1,f),la1],[lo0,lerp(la0,la1,f)],[lo1,lerp(la0,la1,f)])}
  const lon=(lo0+lo1)/2,lat=(la0+la1)/2,pr=d3.geoOrthographic().rotate([-lon,-lat]).fitExtent(rect,{type:'MultiPoint',coordinates:pts});return {lon,lat,R:pr.scale(),tx:pr.translate()[0],ty:pr.translate()[1]}}
const V={start:{lon:172,lat:18,R:430,tx:540,ty:880},
  japan:fit(128.5,146,30.2,45.6,[[90,480],[990,1250]]),
  seto:fit(130.6,135.4,32.9,35.6,[[80,500],[1000,1220]])};
FACTS.forEach(f=>{const [x,y]=PL[f.k];V[f.k]=fit(x-2.3,x+2.3,y-1.5,y+1.5,[[80,520],[1000,1240]])});
const hl=(d,o,fo=.34)=>`<g opacity="${o}"><path d="${d}" fill="${BLUE}" fill-opacity="${fo}"/><path d="${d}" fill="none" stroke="#7fb2ff" stroke-width="12" stroke-opacity=".45" stroke-linejoin="round" style="filter:blur(5px)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/></g>`;
function drawGlobe(c,o={}){const {lon,lat,R,tx,ty}=c;
  GL.viewport(0,0,1080,1920);GL.uniform2f(U.C,tx,1920-ty);GL.uniform1f(U.R,R);GL.uniform2f(U.L,lon*Math.PI/180,lat*Math.PI/180);bindDet(R>2600?'jclose':R>700?'japan':null);GL.drawArrays(GL.TRIANGLE_STRIP,0,4);
  GPR.rotate([-lon,-lat]).scale(R).translate([tx,ty]);const fine=R>1500;
  const fo=.34*(1-clamp((R-2600)/3000))+.06;   // fill fades when we are close to a place
  $('gls').innerHTML=`<path d="${GPATH(fine?MESH10:MESH50)||''}" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity=".5"/>`+((o.hl??1)>.01?hl(GPATH(fine?JP10:JP50)||'',o.hl??1,fo):'')}
const proj=p=>GPR(p);
function slerp(a,b,u){const r=Math.PI/180,va=[Math.cos(a[1]*r)*Math.cos(a[0]*r),Math.cos(a[1]*r)*Math.sin(a[0]*r),Math.sin(a[1]*r)],vb=[Math.cos(b[1]*r)*Math.cos(b[0]*r),Math.cos(b[1]*r)*Math.sin(b[0]*r),Math.sin(b[1]*r)];
  const d=Math.acos(clamp(va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2],-1,1));if(d<1e-6)return a;const s1=Math.sin((1-u)*d)/Math.sin(d),s2=Math.sin(u*d)/Math.sin(d);
  const v=va.map((x,i)=>x*s1+vb[i]*s2);return [Math.atan2(v[1],v[0])/r,Math.asin(clamp(v[2],-1,1))/r]}
const mix=(A,B,u)=>{const e=eio(u),c=slerp([A.lon,A.lat],[B.lon,B.lat],e);return {lon:c[0],lat:c[1],R:Math.exp(lerp(Math.log(A.R),Math.log(B.R),e)),tx:lerp(A.tx,B.tx,e),ty:lerp(A.ty,B.ty,e)}};
function camera(t){
  if(t<.2)return V.start;
  if(t<3.6){const u=seg(t,.2,3.6);const c=mix(V.start,V.japan,u);return c}
  if(t<10)return V.japan;
  if(t<14)return mix(V.japan,V.seto,seg(t,10,12.2));
  if(t<19.5)return V.seto;
  if(t<21)return mix(V.seto,V.japan,seg(t,19.5,21));
  for(const f of FACTS){if(t<f.fly[0])return V.japan;
    if(t<f.fly[1])return mix(V.japan,V[f.k],seg(t,f.fly[0],f.fly[1]));
    if(t<f.back[0])return V[f.k];
    if(t<f.back[1])return mix(V[f.k],V.japan,seg(t,f.back[0],f.back[1]))}
  if(t<88.8)return V.japan;
  const E={lon:150-(t-88.8)*5,lat:22,R:400,tx:540,ty:880};return mix(V.japan,E,seg(t,88.8,91.6))}

// ───────── Japanball rig: drop-in, idle bob, hops with squash & stretch, wiggles, lean, blinks, sparkle bursts
const JBS={};['f1','f2','f3','f9','s1','s2','s3','s9','m2'].forEach(k=>{JBS[k]=`jb/${k}.png`});
const JBI={};Object.entries(JBS).forEach(([k,src])=>{const i=document.createElement('img');i.src=src;i.className='abs';i.style.cssText=k[0]==='m'?'width:300px;left:-146px;top:-152px;opacity:0':'width:260px;left:-130px;top:-130px;opacity:0';$('jbb').appendChild(i);JBI[k]=i});
const HOPS=[[7.3,70],[9.3,36],[24.3,40],[30.5,50],[43.4,56],[47.3,30],[59.5,46],[62.1,34],[67.2,40],[74.5,44],[81.3,62],[87.3,50],[89.5,96],[91.7,64]];
const WIG=[7.3,28.3,57.4,61.0];
const SPARK=[8.7,30.6,43.4,62.1,74.5,81.3,89.6,91.7];
const BLINKS=[];for(let b=1.3;b<93;b+=2.7)BLINKS.push(b);
function jbSprite(t){
  let s='f1';

  const F=FACTS.find(f=>t>=f.open[0]&&t<f.close[1]);
  if(F){s='s1';if(F.k==='aogashima'&&t>=28.2&&t<30.8)s='s3';if(F.k==='kishi'&&t>=43.3&&t<44.6)s='s2';if(F.k==='zao'&&t>=57.3&&t<59.3)s='s3';if(F.k==='zao'&&t>=61.9&&t<63.2)s='s9'}
  if(t>=74.4&&t<86.2)s='m2';
  if(t>=87&&t<89.4)s='s1';if(t>=89.4&&t<90.7)s='f2';
  if((s==='f1'||s==='s1')&&BLINKS.some(b=>t>=b&&t<b+.1))s=s==='f1'?'f9':'s2';
  return s}
function jbMotion(t){let y=0,rot=0,sx=1,sy=1,h=0;
  const pe=seg(t,2.9,3.65);y=-520*(1-bounce(pe));const land=[.364,.727,.909].map(x=>2.9+x*.75);land.forEach(l=>{const u=(t-l)/.12;if(u>=0&&u<1){const k=Math.sin(u*Math.PI)*(l===land[0]?.16:.07);sx+=k;sy-=k}});
  y+=5*Math.sin(t*2*Math.PI/1.8);sy+=.012*Math.sin(t*2*Math.PI/1.8+1);sx-=.012*Math.sin(t*2*Math.PI/1.8+1);
  for(const [h0,H] of HOPS){const pre=seg(t,h0-.1,h0),air=(t-h0)/.5,post=seg(t,h0+.5,h0+.64);
    if(t>=h0-.1&&t<h0){const k=Math.sin(pre*Math.PI/2)*.1;sx+=k;sy-=k}
    if(air>=0&&air<1){const hh=H*4*air*(1-air);y-=hh;h=Math.max(h,hh);const st=.08*Math.sin(air*Math.PI)*(air<.5?1:.4);sy+=st;sx-=st;if(h0===89.5)rot+=360*eio(air)}
    if(t>=h0+.5&&t<h0+.64){const k=Math.sin(post*Math.PI)*.12;sx+=k;sy-=k}}
  for(const w of WIG){const u=(t-w)/.6;if(u>=0&&u<1)rot+=9*Math.sin(u*Math.PI*6)*(1-u)}
  const F=FACTS.find(f=>t>=f.open[0]&&t<f.close[1]);if(F){const u=Math.min(seg(t,F.open[0]+.6,F.open[0]+1.2),1-seg(t,F.close[0]-.4,F.close[0]));rot+=6*eio(u)}
  if(t>=74.4&&t<74.7){const k=.15*Math.sin(seg(t,74.4,74.7)*Math.PI);sx+=k;sy+=k}
  return {y,rot,sx,sy,h,enter:seg(t,2.9,3.0)}}
function renderJB(t){const s=jbSprite(t),m=jbMotion(t);Object.entries(JBI).forEach(([k,i])=>i.style.opacity=k===s?1:0);
  $('jbb').style.transform=`translateY(${m.y.toFixed(1)}px) rotate(${m.rot.toFixed(2)}deg) scale(${m.sx.toFixed(3)},${m.sy.toFixed(3)})`;
