<!doctype html>
<html lang="en">

<style>

<body>
<div id="glw" class="abs" style="inset:0;background:#06182a">
 <canvas id="glc" width="1080" height="1920" class="abs" style="left:0;top:0"></canvas>
 <svg id="gls" class="abs" style="left:0;top:0" width="1080" height="1920"></svg>
 <svg id="glo" class="abs" style="left:0;top:0" width="1080" height="1920"></svg>
</div>
<div id="dim" class="abs" style="inset:0;background:#041222;opacity:0"></div>
<div id="card" class="abs" style="left:80px;top:430px;width:920px;height:720px;border-radius:40px;overflow:hidden;border:8px solid #fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform-origin:50% 50%;visibility:hidden">
 <svg id="cardsvg" width="904" height="704" viewBox="8 8 904 704"></svg>
</div>
<div id="ui" class="abs" style="inset:0"></div>

<script src="lib/world50m.js"></script>

<script src="sat/det_mexico.js"></script>
<script src="sat/det_germany.js"></script>
<script src="sat/det_chile.js"></script>

<script>
const BLUE='#2f7bf5';const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const mk=(parent,h)=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;$(parent).appendChild(e);return e};
// ───────── globe (WebGL orthographic, NASA Blue Marble) + Natural Earth borders; Japan highlight in the house style
const GL=$('glc').getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform sampler2D tex;uniform sampler2D det;uniform vec2 C;uniform float R;uniform vec2 L;
uniform vec3 DG;uniform vec2 DS;uniform float DON;
void main(){vec2 q=(gl_FragCoord.xy-C)/R;float r2=dot(q,q);vec3 bg=vec3(.024,.094,.165);
  if(r2>1.){float d=sqrt(r2)-1.;float g=exp(-d*R/38.)*.55+exp(-d*R/140.)*.18;gl_FragColor=vec4(bg+vec3(.35,.6,1.)*g,1.);return;}
  vec3 v=vec3(q.x,q.y,sqrt(1.-r2));float cl=cos(L.y),sl=sin(L.y);vec3 w=vec3(v.x,v.y*cl+v.z*sl,-v.y*sl+v.z*cl);
  float lon=atan(w.x,w.z)+L.x,lat=asin(clamp(w.y,-1.,1.));float fx=fract(lon/6.2831853+.5);vec2 uv=vec2(fx,.5-lat/3.1415927);
  vec3 c=texture2D(tex,uv).rgb;
  if(DON>0.){float ym=log(tan(.78539816+clamp(lat,-1.47,1.47)*.5));vec2 d=vec2((fx*DG.x-DG.y)/DS.x,((1.-ym/3.1415927)*.5*DG.x-DG.z)/DS.y);
    float wg=smoothstep(0.,.03,d.x)*smoothstep(0.,.03,1.-d.x)*smoothstep(0.,.03,d.y)*smoothstep(0.,.03,1.-d.y);c=mix(c,texture2D(det,d).rgb,wg*DON);}
  c*=1.08;float limb=pow(v.z,.35);c=c*(.55+.45*limb)+vec3(.3,.55,1.)*pow(1.-v.z,3.)*.55;gl_FragColor=vec4(c,1.);}`;
const sh=(t,src)=>{const o=GL.createShader(t);GL.shaderSource(o,src);GL.compileShader(o);if(!GL.getShaderParameter(o,GL.COMPILE_STATUS))throw new Error(GL.getShaderInfoLog(o));return o};
const PG=GL.createProgram();GL.attachShader(PG,sh(GL.VERTEX_SHADER,VS));GL.attachShader(PG,sh(GL.FRAGMENT_SHADER,FS));GL.linkProgram(PG);GL.useProgram(PG);
GL.bindBuffer(GL.ARRAY_BUFFER,GL.createBuffer());GL.bufferData(GL.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),GL.STATIC_DRAW);
const aP=GL.getAttribLocation(PG,'p');GL.enableVertexAttribArray(aP);GL.vertexAttribPointer(aP,2,GL.FLOAT,false,0,0);
const U={};['C','R','L','DG','DS','DON','tex','det'].forEach(n=>U[n]=GL.getUniformLocation(PG,n));GL.uniform1i(U.tex,0);GL.uniform1i(U.det,1);
const TEX=new Image();TEX.src=GLOBE_SRC;
TEX.onload=()=>{GL.activeTexture(GL.TEXTURE0);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,TEX);
  [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE))};
const DETIMG={},DETTEX={};Object.keys(DET_SRC).forEach(k=>{const im=new Image();im.src=DET_SRC[k];DETIMG[k]=im});
function bindDet(k){if(!k){GL.uniform1f(U.DON,0);return}
  if(!DETTEX[k]){GL.activeTexture(GL.TEXTURE1);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,DETIMG[k]);
    [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE));DETTEX[k]=t}
  GL.activeTexture(GL.TEXTURE1);GL.bindTexture(GL.TEXTURE_2D,DETTEX[k]);GL.activeTexture(GL.TEXTURE0);
  const r=DET_REF[k];GL.uniform3f(U.DG,256*2**r.z,r.X0*256,r.Y0*256);GL.uniform2f(U.DS,r.W,r.H);GL.uniform1f(U.DON,1)}
const C10=topojson.feature(WORLD10,WORLD10.objects.countries).features,C50=topojson.feature(WORLD50,WORLD50.objects.countries).features;

const MESH10=topojson.mesh(WORLD10,WORLD10.objects.countries,(a,b)=>a!==b),MESH50=topojson.mesh(WORLD50,WORLD50.objects.countries,(a,b)=>a!==b);
const GPR=d3.geoOrthographic().clipAngle(90).precision(.3),GPATH=d3.geoPath(GPR);
// camera views: fit a lon/lat box into a screen rect
function fit(lo0,lo1,la0,la1,rect){const pts=[];for(let i=0;i<=24;i++){const f=i/24;pts.push([lerp(lo0,lo1,f),la0],[lerp(lo0,lo1,f),la1],[lo0,lerp(la0,la1,f)],[lo1,lerp(la0,la1,f)])}
  const lon=(lo0+lo1)/2,lat=(la0+la1)/2,pr=d3.geoOrthographic().rotate([-lon,-lat]).fitExtent(rect,{type:'MultiPoint',coordinates:pts});return {lon,lat,R:pr.scale(),tx:pr.translate()[0],ty:pr.translate()[1]}}
const hl=(d,o,fo=.34)=>`<g opacity="${o}"><path d="${d}" fill="${BLUE}" fill-opacity="${fo}"/><path d="${d}" fill="none" stroke="#7fb2ff" stroke-width="12" stroke-opacity=".45" stroke-linejoin="round" style="filter:blur(5px)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/></g>`;
function drawGlobe(c,o={}){const {lon,lat,R,tx,ty}=c;
  GL.viewport(0,0,1080,1920);GL.uniform2f(U.C,tx,1920-ty);GL.uniform1f(U.R,R);GL.uniform2f(U.L,lon*Math.PI/180,lat*Math.PI/180);bindDet(o.det||null);GL.drawArrays(GL.TRIANGLE_STRIP,0,4);
  GPR.rotate([-lon,-lat]).scale(R).translate([tx,ty]);const f=C10.find(x=>x.id===o.id),d=GPATH(f)||'';
  const dim=o.dim?`<path d="M0 0H1080V1920H0Z ${d}" fill="#040c18" fill-opacity="${o.dim}" fill-rule="evenodd"/>`:'';
  $('gls').innerHTML=`<path d="${GPATH(MESH10)||''}" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity="${o.dim?.25:.5}"/>`+dim+hl(d,1,.3)}
const proj=p=>GPR(p);
function slerp(a,b,u){const r=Math.PI/180,va=[Math.cos(a[1]*r)*Math.cos(a[0]*r),Math.cos(a[1]*r)*Math.sin(a[0]*r),Math.sin(a[1]*r)],vb=[Math.cos(b[1]*r)*Math.cos(b[0]*r),Math.cos(b[1]*r)*Math.sin(b[0]*r),Math.sin(b[1]*r)];
  const d=Math.acos(clamp(va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2],-1,1));if(d<1e-6)return a;const s1=Math.sin((1-u)*d)/Math.sin(d),s2=Math.sin(u*d)/Math.sin(d);
  const v=va.map((x,i)=>x*s1+vb[i]*s2);return [Math.atan2(v[1],v[0])/r,Math.asin(clamp(v[2],-1,1))/r]}
const mix=(A,B,u)=>{const e=eio(u),c=slerp([A.lon,A.lat],[B.lon,B.lat],e);return {lon:c[0],lat:c[1],R:Math.exp(lerp(Math.log(A.R),Math.log(B.R),e)),tx:lerp(A.tx,B.tx,e),ty:lerp(A.ty,B.ty,e)}};

// ───────── layout (mockup): title · level + progress · map zone 440–1180 · ball left + plate right · subtitles
const TITLE=mk('ui',`<div class="pill" style="left:540px;top:240px;height:104px;padding:0 50px;border-radius:36px;font-weight:900;font-size:62px;letter-spacing:-.02em">GUESS THE <span style="color:${BLUE};margin-left:.28em">COUNTRY</span></div>`);
const LVL=mk('ui',`<div class="pill" style="left:470px;top:340px;height:60px;padding:0 26px;font-weight:800;font-size:27px;letter-spacing:.06em;gap:12px"></div>`);
const PRG=mk('ui',`<div class="pill" style="left:850px;top:340px;height:60px;padding:0 22px;font-weight:900;font-size:28px;color:${BLUE}"></div>`);
const PLATE=mk('ui',`<div class="abs" style="left:640px;top:1330px;transform:translate(-50%,-50%);width:540px;height:190px;padding:20px 30px;border-radius:40px;background:rgba(255,255,255,.97);box-shadow:0 18px 40px -18px rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;gap:26px"></div>`);
const SUB=mk('ui',`<div class="abs" style="left:540px;top:1532px;transform:translate(-50%,-50%);padding:16px 36px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 16px 34px -16px rgba(10,20,40,.55);font-weight:600;font-size:40px;white-space:nowrap"></div>`);
const BALL=mk('ui',`<svg class="abs" style="left:65px;top:1190px;overflow:visible" width="280" height="290" viewBox="-140 -150 280 290"></svg>`);
const ZONE=mk('ui',`<div class="abs" style="left:60px;top:440px;width:960px;height:740px;border:3px dashed rgba(255,214,77,.0);border-radius:30px"></div>`);
// countryball drawn as vector: white body (or a flag swept in by a mask), black outline, gloss, oval eyes looking up-right
const FLAGS={chile:`<rect x="-130" y="-130" width="260" height="130" fill="#fff"/><rect x="-130" y="0" width="260" height="132" fill="#d52b1e"/><rect x="-130" y="-130" width="130" height="130" fill="#0039a6"/><path d="M-65 -94 L-57 -71 L-33 -71 L-52 -57 L-45 -34 L-65 -48 L-85 -34 L-78 -57 L-97 -71 L-73 -71Z" fill="#fff"/>`,germany:`<rect x="-130" y="-130" width="260" height="88" fill="#111"/><rect x="-130" y="-42" width="260" height="88" fill="#dd0000"/><rect x="-130" y="46" width="260" height="90" fill="#ffce00"/>`,
 mexico:`<rect x="-130" y="-130" width="88" height="260" fill="#006847"/><rect x="-42" y="-130" width="86" height="260" fill="#fff"/><rect x="44" y="-130" width="88" height="260" fill="#ce1126"/>`};
function ball(o={}){const r=118,sweep=o.sweep??0,flag=o.flag;const lookX=o.lx??14,lookY=o.ly??-12;
  return `<defs><clipPath id="bc"><circle r="${r}"/></clipPath><clipPath id="sw"><rect x="${-r-10}" y="${-r-10+(1-sweep)*(2*r+20)}" width="${2*r+20}" height="${2*r+20}"/></clipPath>
   <radialGradient id="bs" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".65" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient></defs>
  <ellipse cx="0" cy="${r+14}" rx="${r*.8}" ry="16" fill="#000" opacity=".3" style="filter:blur(6px)"/>
  <g clip-path="url(#bc)"><circle r="${r}" fill="#f6f7f9"/>${o.q?`<text x="-52" y="76" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="64" fill="${BLUE}" transform="rotate(-12 -52 60)">?</text>`:''}
   ${flag?`<g clip-path="url(#sw)">${FLAGS[flag]}</g>${sweep>0&&sweep<1?`<rect x="${-r}" y="${-r+(1-sweep)*(2*r)-3}" width="${2*r}" height="6" fill="#fff" opacity=".9"/>`:''}`:''}
   <circle r="${r}" fill="url(#bs)"/><ellipse cx="-44" cy="-62" rx="34" ry="20" fill="#fff" opacity=".75" transform="rotate(-30 -44 -62)"/></g>
  <circle r="${r}" fill="none" stroke="#0d0d0f" stroke-width="7"/>
  ${o.happy?`<path d="M-6 -36 Q14 -58 34 -36 M48 -40 Q66 -60 84 -40" stroke="#0d0d0f" stroke-width="7" fill="none" stroke-linecap="round"/>`:
  `<ellipse cx="14" cy="-30" rx="26" ry="32" fill="#fff" stroke="#0d0d0f" stroke-width="6"/><ellipse cx="68" cy="-38" rx="23" ry="29" fill="#fff" stroke="#0d0d0f" stroke-width="6"/>
   <circle cx="${14+lookX*.6}" cy="${-30+lookY}" r="11" fill="#0d0d0f"/><circle cx="${68+lookX*.6}" cy="${-38+lookY}" r="10" fill="#0d0d0f"/><circle cx="${18+lookX*.6}" cy="${-35+lookY}" r="3.5" fill="#fff"/><circle cx="${71+lookX*.6}" cy="${-43+lookY}" r="3.2" fill="#fff"/>`}`}
const level=(n,name,col)=>`<span style="width:18px;height:18px;border-radius:50%;background:${col};box-shadow:0 0 12px ${col}"></span>LEVEL ${n} · <span style="color:${col==='#f2b705'?'#c99400':col}">${name}</span>`;
const timer=(n,frac,col)=>{const r=58,a2=-Math.PI/2+frac*2*Math.PI,large=frac>.5?1:0;return `<svg width="150" height="150" viewBox="-75 -75 150 150"><circle r="${r}" fill="none" stroke="#e7eaf1" stroke-width="12"/><path d="M0 ${-r} A${r} ${r} 0 ${large} 1 ${(r*Math.cos(a2)).toFixed(1)} ${(r*Math.sin(a2)).toFixed(1)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/><text y="24" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="68" fill="${col==='#f2b705'?'#c99400':col}">${n}</text></svg>`};
function V(lo0,lo1,la0,la1){return fit(lo0,lo1,la0,la1,[[90,470],[990,1170]])}
const ring=(n,frac,col,r=150)=>{const a2=-Math.PI/2+frac*2*Math.PI,large=frac>.5?1:0;return `<circle r="${r}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="14"/><path d="M0 ${-r} A${r} ${r} 0 ${large} 1 ${(r*Math.cos(a2)).toFixed(1)} ${(r*Math.sin(a2)).toFixed(1)}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/>`};
const answerPill=(name)=>`<div style="display:flex;align-items:center;gap:20px"><div style="width:64px;height:64px;border-radius:50%;background:#30c060;display:flex;align-items:center;justify-content:center"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="font-weight:900;font-size:60px">${name}</div></div>`;
const eo=p=>1-Math.pow(1-p,3),seg=(t,a,b)=>clamp((t-a)/(b-a)),eb=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
// V1 layout: map zone y 430–1230; ball = timer; answer pill pops just above the ball. Tall countries: map shifts left, ball moves right.
const L1={map:[[110,440],[970,1230]],ball:[540,1430],pill:[540,1205]};
const LT={map:[[150,430],[640,1520]],ball:[790,1330],pill:[790,1100]};
function scene(t,o){const L=o.tall?LT:L1;const u0=eo(seg(t,0,.4)),V0=fit(...o.box,L.map);const c={...V0,R:V0.R*(.94+.06*u0)};
  drawGlobe(c,{det:o.det,id:o.id,dim:o.dim});
  const think=t>=.4&&t<5.4,e=t-.4,n=5-Math.floor(e),col=n>=4?'#30c060':n>=2?'#f2b705':'#ff3b30',frac=think?1-e/5:0;
  const rev=t>=5.4,sw=eio(seg(t,5.4,5.6)),reset=seg(t,6.4,6.8),sweep=sw*(1-reset),pop=think?eb(seg(e%1,0,.25)):1;
  const ringO=think?1:1-seg(t,5.4,5.6);
  const blink=(t>2.1&&t<2.2)||(t>4.3&&t<4.4);const ly=think?-12+22*seg(t,.6,5.2):-12;
  BALL.setAttribute('viewBox','-190 -200 380 400');BALL.style.cssText=`position:absolute;left:${L.ball[0]-190}px;top:${L.ball[1]-200}px;overflow:visible;width:380px;height:400px`;
  const bob=3*Math.sin(t*2*Math.PI/1.6),sq=rev&&t<5.9?.06*Math.sin(seg(t,5.4,5.9)*Math.PI):0;
  BALL.innerHTML=`<g opacity="${ringO}">${ring(n,frac,col,158)}${think?`<g transform="translate(118 -118) scale(${(.8+.2*pop).toFixed(3)})"><circle r="40" fill="#fff"/><text y="17" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="48" fill="${col==='#f2b705'?'#c99400':col}">${n}</text></g>`:''}</g>
   <g transform="translate(0 ${bob.toFixed(1)}) scale(${(1+sq).toFixed(3)},${(1-sq).toFixed(3)})">${ball(sweep>0?{flag:o.flag,sweep,happy:t>=5.6&&t<6.4}:{q:1,lx:o.tall?0:14,ly:blink?0:ly})}</g>
   ${blink&&!rev?'':''}`;
  if(blink&&!rev)BALL.innerHTML=BALL.innerHTML.replace(/<ellipse cx="14" cy="-30"[^>]*\/><ellipse cx="68"[^>]*\/>[\s\S]*?r="3.2" fill="#fff"\/>/,'<path d="M-8 -30 Q14 -18 36 -30 M48 -38 Q68 -26 88 -38" stroke="#0d0d0f" stroke-width="7" fill="none" stroke-linecap="round"/>');
  const pp=eb(seg(t,5.45,5.75))*(1-seg(t,6.3,6.5));
  PLATE.style.cssText=`position:absolute;left:${L.pill[0]}px;top:${L.pill[1]}px;transform:translate(-50%,-50%) scale(${(.6+.4*pp).toFixed(3)});opacity:${clamp(pp*2)};padding:16px 38px;border-radius:40px;background:rgba(255,255,255,.97);box-shadow:0 18px 40px -18px rgba(10,20,40,.55);display:flex`;
  PLATE.innerHTML=answerPill(o.name);
  SUB.style.visibility=rev&&t<6.6?'visible':'hidden';SUB.style.top='1660px';SUB.innerHTML=o.name.charAt(0)+o.name.slice(1).toLowerCase()+'<span style="color:#2f7bf5;font-weight:800">!</span>';
  LVL.innerHTML=level(o.lvl[0],o.lvl[1],o.lvl[2]);PRG.textContent=o.prg;[TITLE,LVL,PRG].forEach(x=>x.style.transform='translate(-50%,-50%)');
  let fx='';const s0=5.62,uu=(t-s0)/.55;if(uu>=0&&uu<1)for(let i=0;i<8;i++){const a=i/8*6.283+.3,r=170+uu*70,x=L.ball[0]+Math.cos(a)*r,y=L.ball[1]+Math.sin(a)*r*.9,sc=(1-uu)*(i%2?10:15);fx+=`<path d="M${x} ${y-sc} L${x+sc*.28} ${y-sc*.28} L${x+sc} ${y} L${x+sc*.28} ${y+sc*.28} L${x} ${y+sc} L${x-sc*.28} ${y+sc*.28} L${x-sc} ${y} L${x-sc*.28} ${y-sc*.28}Z" fill="${i%2?'#ffd34d':'#fff'}" opacity="${(1-uu).toFixed(2)}"/>`}
  $('glo').innerHTML=fx}
// sprite countryball: white base + flag frame revealed by a bottom-up mask
const SB=mk('ui',`<div class="abs" style="left:0;top:0;width:0;height:0;z-index:4"><div id="sbsh" class="abs" style="left:-100px;top:112px;width:200px;height:28px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0))"></div><img id="sbw" class="abs"><img id="sbf" class="abs"><div id="sbl" class="abs" style="height:6px;background:#fff;border-radius:3px;box-shadow:0 0 14px #fff"></div></div>`);
function sprite(el,key,D=236){const m=BM[key];const k=D/Math.max(m.w,m.h*.98);el.src=`balls/${key}.png`;el.style.width=(m.w*k)+'px';el.style.left=(-m.w*k/2)+'px';el.style.top=(-m.h*k/2)+'px';return m.h*k}
function setBall(x,y,white,flag,sweep){SB.style.left=x+'px';SB.style.top=y+'px';sprite($('sbw'),white);const fh=flag?sprite($('sbf'),flag):236;
  $('sbf').style.display=flag&&sweep>0?'block':'none';$('sbf').style.clipPath=`inset(${((1-sweep)*100).toFixed(1)}% 0 0 0)`;
