<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inflation is down — keyframes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f7f3ec}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#0d0d12}
#root{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.blob{position:absolute;width:1400px;height:1400px;border-radius:50%;opacity:.5}
.sq{display:flex;align-items:center;justify-content:center}
.cap{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:.93;text-align:center;white-space:nowrap}
.mono{font-family:'DejaVu Sans Mono',monospace}
.card{position:absolute;border-radius:56px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.30) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);border:1.5px solid rgba(255,255,255,.8);
  box-shadow:0 34px 70px -26px rgba(70,45,20,.28),0 8px 20px -8px rgba(70,45,20,.10),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(255,255,255,.55),
    inset 14px 18px 34px -16px rgba(255,255,255,.85),inset -14px -18px 36px -16px rgba(170,140,110,.25)}
.card::before,.pill::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 68%,rgba(255,255,255,.28) 100%)}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;
  background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 16px 34px -14px rgba(70,45,20,.3),inset 0 2px 0 rgba(255,255,255,.95),inset 8px 10px 20px -10px rgba(255,255,255,.8)}
.phone{position:absolute;width:600px;height:1240px;border-radius:96px;background:linear-gradient(160deg,#3a3a44,#121217 60%,#2a2a33);padding:18px;
  box-shadow:0 80px 140px -40px rgba(70,40,20,.5),0 30px 60px -20px rgba(70,40,20,.28),inset 0 0 0 3px #4a4a55,inset 0 0 0 7px #0c0c10}
.screen{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;background:#fbfaf7}
.island{position:absolute;left:50%;top:22px;width:170px;height:50px;margin-left:-85px;border-radius:25px;background:#08080b;z-index:5}
.receipt{position:absolute;background:#fffdf8;box-shadow:0 40px 80px -30px rgba(70,45,20,.35),0 10px 24px -10px rgba(70,45,20,.18)}
.tag{position:absolute;color:#fff;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffb15c,#ff6a00);clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);
  filter:drop-shadow(0 20px 26px rgba(200,80,0,.35))}
.T{color:#0fa3a0}.O{color:#ff6a00}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const root=document.getElementById('root');
const BLOBP=[[150,300],[920,760],[180,1500],[900,1680]];
const bg=(c=['#ffd9b0','#bdeee4','#ffe9c2','#ffd0c2'])=>`<div class="abs" style="inset:0;background:radial-gradient(120% 60% at 50% 0%,#fffdf9 0%,#f7f3ec 55%,#efe9df 100%)">${BLOBP.map((p,i)=>`<div class="blob" style="left:${p[0]-700}px;top:${p[1]-700}px;background:radial-gradient(circle,${c[i]} 0%,${c[i]}00 64%)"></div>`).join('')}</div>`;
const IC={down:'<path d="M12 4v16M5.5 13.5L12 20l6.5-6.5"/>',up:'<path d="M12 20V4M5.5 10.5L12 4l6.5 6.5"/>',back:'<path d="M20 12H4M10.5 5.5L4 12l6.5 6.5"/>',
  basket:'<path d="M3.5 9.5h17l-1.8 9.2a2 2 0 0 1-2 1.6H7.3a2 2 0 0 1-2-1.6z"/><path d="M8 9.5l3-5M16 9.5l-3-5M9 13.5v3M12 13.5v3M15 13.5v3"/>'};
const icon=(n,s,c,sw=2.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

// ── objects
function phone(inner,x,y,s){return `<div class="phone" style="left:${x-300}px;top:${y-620}px;transform:scale(${s})"><div class="screen"><div class="island"></div>${inner}</div></div>`}
const newsScreen=`<div class="abs" style="left:40px;top:110px;font-weight:900;font-size:44px;letter-spacing:-.03em">News</div>
  <div class="abs" style="left:40px;top:168px;font-weight:600;font-size:22px;color:#9a978f">Today · Economy</div>
  <div class="card" style="left:28px;top:230px;width:508px;height:560px;border-radius:44px;padding:36px;background:linear-gradient(160deg,#e9fbf8,#ffffff)">
     <div class="pill" style="position:static;display:inline-flex;height:46px;padding:0 20px;font-weight:800;font-size:20px;color:#0fa3a0;letter-spacing:.08em">ECONOMY</div>
     <div style="margin-top:34px;font-weight:900;font-size:76px;line-height:.95;letter-spacing:-.04em">INFLATION<br>IS DOWN</div>
     <div class="sq" style="position:absolute;right:34px;bottom:34px;width:150px;height:150px;border-radius:50%;background:linear-gradient(160deg,#5fe3c8,#0fa3a0);box-shadow:0 18px 34px -12px rgba(15,163,160,.6)">${icon('down',96,'#fff',3)}</div>
     <div style="position:absolute;left:36px;bottom:60px;width:240px;height:16px;border-radius:8px;background:#dfe9e6"></div>
     <div style="position:absolute;left:36px;bottom:92px;width:300px;height:16px;border-radius:8px;background:#dfe9e6"></div></div>
  ${[0,1].map(i=>`<div class="abs" style="left:28px;top:${830+i*130}px;width:508px;height:110px;border-radius:30px;background:#f1eee7;display:flex;align-items:center;gap:18px;padding:0 22px">
     <div style="width:66px;height:66px;border-radius:18px;background:#e2ddd2"></div><div><div style="width:${280-i*60}px;height:14px;border-radius:7px;background:#d9d3c7"></div><div style="width:${200-i*40}px;height:14px;border-radius:7px;background:#e5e0d6;margin-top:12px"></div></div></div>`).join('')}`;
// receipt: rows are placeholders, TOTAL is the only number
function receipt(x,y,w,h,total,basketRow=-1,zig='bottom'){
  const rows=[];const n=Math.floor((h-300)/62);
  for(let i=0;i<n;i++)rows.push(`<div style="display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 44px">
    <div style="display:flex;align-items:center;gap:14px">${i===basketRow?`<span class="sq" style="width:40px;height:40px;border-radius:12px;background:#fff1e4">${icon('basket',28,'#ff6a00',2.2)}</span>`:''}<i style="display:block;width:${120+((i*37)%140)}px;height:14px;border-radius:7px;background:#d6d0c4"></i></div>
    <i style="display:block;width:${70+((i*23)%40)}px;height:14px;border-radius:7px;background:#cfc8bb"></i></div>`);
  const zz=`linear-gradient(-45deg,transparent 12px,#fffdf8 0) 0 0/24px 24px repeat-x, linear-gradient(45deg,transparent 12px,#fffdf8 0) 0 0/24px 24px repeat-x`;
  return `<div class="receipt" style="left:${x-w/2}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="mono" style="text-align:center;padding-top:40px;font-weight:700;font-size:26px;color:#3a372f;letter-spacing:.2em">GROCERY</div>
    <div style="margin:18px 44px 14px;border-top:3px dashed #d6d0c4"></div>${rows.join('')}
    <div style="position:absolute;left:44px;right:44px;bottom:70px;border-top:3px dashed #d6d0c4;padding-top:26px;display:flex;align-items:baseline;justify-content:space-between">
      <span class="mono" style="font-weight:700;font-size:34px;color:#3a372f;letter-spacing:.12em">TOTAL</span><span style="font-weight:900;font-size:110px;letter-spacing:-.04em;color:#ff6a00">${total}</span></div>
    <div style="position:absolute;left:0;right:0;bottom:-12px;height:24px;background:${zz};transform:rotate(180deg)"></div></div>`}
// products (simple 3D-ish SVG)
const MILK=(s=1)=>`<svg width="${130*s}" height="${230*s}" viewBox="0 0 130 230"><defs><linearGradient id="mk" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ebf2"/></linearGradient></defs>
  <path d="M10 70 L10 222 Q10 228 16 228 L114 228 Q120 228 120 222 L120 70 L95 36 L35 36 Z" fill="url(#mk)"/><path d="M35 36 L95 36 L95 18 L35 18 Z" fill="#f3f5f9"/><rect x="72" y="4" width="20" height="16" rx="4" fill="#6fa8ff"/>
  <rect x="10" y="120" width="110" height="64" fill="#6fa8ff"/><text x="65" y="163" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="30" fill="#fff">MILK</text>
  <path d="M10 70 L35 36 L95 36 L120 70Z" fill="#dfe6ef"/></svg>`;
const BREAD=(s=1)=>`<svg width="${230*s}" height="${130*s}" viewBox="0 0 230 130"><defs><linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b766"/><stop offset="1" stop-color="#c47a2c"/></linearGradient></defs>
  <path d="M14 120 Q4 60 50 30 Q115 -4 180 30 Q226 60 216 120 Z" fill="url(#br)"/>${[60,105,150].map(x=>`<path d="M${x} 44 Q${x+18} 60 ${x+8} 84" stroke="#f9d9a6" stroke-width="7" fill="none" stroke-linecap="round"/>`).join('')}</svg>`;
const EGGS=(s=1)=>`<svg width="${220*s}" height="${130*s}" viewBox="0 0 220 130"><defs><radialGradient id="eg" cx=".35" cy=".3"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ead9bd"/></radialGradient></defs>
  ${[45,110,175].map(x=>`<ellipse cx="${x}" cy="56" rx="30" ry="40" fill="url(#eg)"/>`).join('')}<path d="M6 70 H214 L200 126 H20 Z" fill="#c9b79a"/><path d="M6 70 H214 L208 86 H12 Z" fill="#dccbb0"/></svg>`;
const APPLE=(s=1,c='#ff4d4d')=>`<svg width="${110*s}" height="${116*s}" viewBox="0 0 110 116"><defs><radialGradient id="ap${c.slice(1)}" cx=".35" cy=".35"><stop offset="0" stop-color="#ff9b8a"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="#b8202a"/></radialGradient></defs>
  <path d="M55 30 C 25 10, 2 35, 6 66 C 10 100, 35 116, 55 106 C 75 116, 100 100, 104 66 C 108 35, 85 10, 55 30 Z" fill="url(#ap${c.slice(1)})"/><path d="M55 30 Q 54 14 60 4" stroke="#6b4b2a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M60 14 Q 80 0 92 12 Q 76 24 60 14Z" fill="#43c56a"/><ellipse cx="34" cy="46" rx="10" ry="16" fill="#fff" opacity=".35"/></svg>`;
function basket(x,y,s=1,ghost=0){
  return `<div class="abs" style="left:${x-260}px;top:${y-250}px;width:520px;height:500px;transform:scale(${s});opacity:${ghost?.38:1};filter:${ghost?'saturate(.6)':'none'}">
   <svg class="abs" style="left:0;top:0" width="520" height="500"><path d="M80 210 Q 260 -40 440 210" stroke="#b9b2a6" stroke-width="18" fill="none" stroke-linecap="round"/>
     <ellipse cx="260" cy="214" rx="230" ry="34" fill="#a39c90"/></svg>
   <div class="abs" style="left:200px;top:30px">${BREAD(1.2)}</div><div class="abs" style="left:56px;top:-40px">${MILK(1.25)}</div>
   <div class="abs" style="left:290px;top:110px">${EGGS(1.05)}</div><div class="abs" style="left:130px;top:118px">${APPLE(1.15)}</div><div class="abs" style="left:240px;top:140px">${APPLE(1.0,'#f0602e')}</div>
   <svg class="abs" style="left:0;top:0" width="520" height="500"><defs><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7e1d6"/></linearGradient></defs>
     <path d="M30 214 L490 214 L452 462 Q448 482 428 482 L92 482 Q72 482 68 462 Z" fill="url(#bk)" stroke="#fff" stroke-width="4"/>
     ${[270,320,370,420].map(yy=>`<path d="M${42+(yy-214)*.15} ${yy} L${478-(yy-214)*.15} ${yy}" stroke="#d9d2c5" stroke-width="6" stroke-linecap="round"/>`).join('')}
     <path d="M30 214 L490 214" stroke="#cfc7b9" stroke-width="12" stroke-linecap="round"/></svg>
   <div class="abs" style="left:0;top:470px;width:520px;height:40px;border-radius:50%;background:radial-gradient(rgba(70,45,20,.25),rgba(70,45,20,0) 70%)"></div></div>`}
const tag=(x,y,w,h,txt,fs)=>`<div class="tag" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;font-size:${fs}px;padding-left:${w*.14}px">${txt}<i style="position:absolute;left:${w*.08}px;top:${h/2-h*.09}px;width:${h*.18}px;height:${h*.18}px;border-radius:50%;background:#f7f3ec"></i></div>`;
function gauge(x,y,r,val,col='#0fa3a0'){ // val 0..1
  const a0=-210,a1=30,ang=a0+(a1-a0)*val,rad=d=>d*Math.PI/180;
  const arc=(r1,from,to)=>{const p=d=>[x+r1*Math.cos(rad(d)),y+r1*Math.sin(rad(d))];const [sx,sy]=p(from),[ex,ey]=p(to);return `M${sx} ${sy} A${r1} ${r1} 0 ${to-from>180?1:0} 1 ${ex} ${ey}`};
  let ticks='';for(let i=0;i<=12;i++){const d=a0+(a1-a0)*i/12;const [c,s]=[Math.cos(rad(d)),Math.sin(rad(d))];ticks+=`<line x1="${x+c*(r-70)}" y1="${y+s*(r-70)}" x2="${x+c*(r-48)}" y2="${y+s*(r-48)}" stroke="#9a978f" stroke-width="${i%3?4:7}" stroke-linecap="round"/>`}
  return `<div class="card" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%"></div>
  <svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920"><path d="${arc(r-28,a0,a1)}" stroke="#e7e1d6" stroke-width="22" fill="none" stroke-linecap="round"/>
   <path d="${arc(r-28,a0,ang)}" stroke="${col}" stroke-width="22" fill="none" stroke-linecap="round"/>${ticks}
   <line x1="${x}" y1="${y}" x2="${x+Math.cos(rad(ang))*(r-90)}" y2="${y+Math.sin(rad(ang))*(r-90)}" stroke="#0d0d12" stroke-width="12" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="24" fill="#0d0d12"/></svg>`}
const car=(x,y,s=1)=>`<svg class="abs" style="left:${x-170*s}px;top:${y-110*s}px" width="${340*s}" height="${220*s}" viewBox="0 0 340 220"><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb15c"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
  <ellipse cx="170" cy="204" rx="150" ry="12" fill="rgba(70,45,20,.25)"/><path d="M20 150 Q18 108 60 100 L100 56 Q112 44 130 44 L222 44 Q240 44 252 58 L288 100 Q324 106 324 140 L324 160 Q324 172 312 172 L32 172 Q20 172 20 160 Z" fill="url(#cb)"/>
  <path d="M112 64 L132 60 L170 60 L170 100 L94 100 Z" fill="#dff6ff"/><path d="M184 60 L224 60 Q234 60 240 70 L262 100 L184 100 Z" fill="#dff6ff"/>
  ${[90,250].map(cx=>`<circle cx="${cx}" cy="168" r="36" fill="#22242c"/><circle cx="${cx}" cy="168" r="16" fill="#e7e1d6"/>`).join('')}<rect x="300" y="118" width="22" height="14" rx="5" fill="#fff4c2"/></svg>`;

// ── frames
const F={};
F['1a']=()=>bg()+phone(newsScreen,540,1010,1.36);
F['1b']=()=>bg()+receipt(540,800,620,1040,'112.20',4)+phone(newsScreen,540,520,.62)+
  `<div class="cap" style="left:0;width:1080px;top:-200px"></div>`;
F['2']=()=>bg(['#ffd9b0','#bdeee4','#ffe3c9','#c9f0e6'])+
  `<div class="cap" style="left:0;width:1080px;top:190px;font-size:118px">PRICES <span class="O">STILL RISE</span></div>
   <div class="cap" style="left:0;width:1080px;top:310px;font-size:84px;color:#3a372f">JUST MORE SLOWLY</div>`+
  `<div class="pill" style="left:70px;top:560px;height:110px;padding:0 40px;font-weight:900;font-size:56px;gap:12px" ><span class="T">INFLATION</span>${icon('down',58,'#0fa3a0',3.2)}</div>`+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M810 1290 C 812 1150, 820 1010, 830 900 C 836 830, 842 790, 850 760" stroke="#ff6a00" stroke-width="9" fill="none" stroke-linecap="round" opacity=".55" stroke-dasharray="2 16"/>
   <path d="M850 760 C 856 735, 862 720, 870 712" stroke="#ff6a00" stroke-width="12" fill="none" stroke-linecap="round"/></svg>`+
  tag(780,620,250,150,'↑',80)+basket(470,1290,1.45);
F['3']=()=>{
  const bars=[[230,100,'100.00'],[540,110,'110.00'],[850,112.2,'112.20']];const base=1560,k=7.2;
  return bg(['#ffd9b0','#bdeee4','#ffe9c2','#ffd0c2'])+
  `<div class="pill" style="left:290px;top:190px;height:76px;padding:0 34px;font-weight:800;font-size:28px;letter-spacing:.14em;color:#6f6a60">ILLUSTRATIVE EXAMPLE</div>`+
  `<div class="cap" style="left:0;width:1080px;top:310px;font-size:190px">112.20</div>`+
  `<div class="pill" style="left:150px;top:560px;height:90px;padding:0 34px;font-weight:900;font-size:48px;color:#ff6a00">+10%</div>
   <div class="pill" style="left:640px;top:560px;height:90px;padding:0 34px;font-weight:900;font-size:48px;color:#0fa3a0">+2%</div>`+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M230 ${base-100*k} L540 ${base-110*k} L850 ${base-112.2*k}" stroke="#0d0d12" stroke-width="6" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>
    <path d="M330 690 Q 385 760 440 690" stroke="#ff6a00" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M640 690 Q 695 740 750 690" stroke="#0fa3a0" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`+
  bars.map(([x,v,l],i)=>`<div class="abs" style="left:${x-110}px;top:${base-v*k+40}px;width:220px;height:${v*k-40}px;border-radius:40px 40px 18px 18px;background:linear-gradient(180deg,${i?'#ffb15c':'#ffc98f'},#ff6a00);box-shadow:0 30px 60px -20px rgba(255,106,0,.45),inset 0 3px 0 rgba(255,255,255,.5)"></div>
    <div class="abs" style="left:${x-150}px;top:${base-v*k-40}px;width:300px;text-align:center;font-weight:900;font-size:62px;letter-spacing:-.03em">${l}</div>`).join('')+
  `<div class="abs" style="left:${230-90}px;top:${base+30}px">${''}</div>`+basket(120,420,.34);};
F['4']=()=>bg(['#ffe3c9','#bdeee4','#ffe9c2','#ffd9b0'])+
  gauge(540,820,330,.18)+`<div class="abs" style="left:440px;top:930px;width:200px;text-align:center;font-weight:900;font-size:64px" class="T"><span class="T">2%</span></div>`+
  `<div class="abs" style="left:0;top:1300px;width:1080px;height:300px;background:linear-gradient(180deg,#e9e3d8,#ddd6c9)"></div>
   ${[0,1,2,3,4].map(i=>`<div class="abs" style="left:${-40+i*260}px;top:1440px;width:150px;height:18px;border-radius:9px;background:#fff"></div>`).join('')}
   ${[0,1,2].map(i=>`<div class="abs" style="left:${120+i*110}px;top:${1330+i*50}px;width:${140-i*20}px;height:8px;border-radius:4px;background:rgba(255,106,0,.35)"></div>`).join('')}`+
  car(640,1360,1.15)+
  `<div class="abs" style="left:110px;top:1330px;opacity:.28;display:flex;align-items:center;gap:10px;font-weight:900;font-size:40px;color:#6f6a60">${icon('back',90,'#6f6a60',2.6)}REVERSE</div>`+
  `<div class="cap" style="left:0;width:1080px;top:1660px;font-size:150px" ><span class="O">SLOWER</span></div>`+
  `<div class="cap" style="left:0;width:1080px;top:200px;font-size:66px;color:#6f6a60;letter-spacing:.02em">INFLATION RATE</div>`;
F['5']=()=>bg(['#ffd9b0','#bdeee4','#ffe3c9','#ffd0c2'])+
  `<div class="cap" style="left:0;width:1080px;top:190px;font-size:128px">SAME BASKET.</div><div class="cap" style="left:0;width:1080px;top:320px;font-size:128px">HIGHER <span class="O">BILL.</span></div>`+
  basket(285,960,.88,1)+basket(800,960,.88)+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920">${[[160,800,675,800],[260,880,775,880],[350,960,865,960]].map(l=>`<path d="M${l[0]+70} ${l[1]} L${l[2]-60} ${l[3]}" stroke="#0d0d12" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".45"/>`).join('')}</svg>`+
  `<div class="card sq" style="left:120px;top:1250px;width:330px;height:150px;border-radius:44px;font-weight:900;font-size:76px;letter-spacing:-.03em;color:#9a978f">100.00</div>
