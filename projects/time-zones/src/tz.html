<script>
const BLUE='#2f7bf5',ORNG='#ff8a1f';const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t;

const mk=(parent,h)=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;$(parent).appendChild(e);return e};

const shine=`<div class="shn abs" style="inset:0;border-radius:inherit;overflow:hidden;pointer-events:none"><div class="abs" style="top:-20%;bottom:-20%;width:38%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,0) 20%,rgba(160,200,255,.55) 50%,rgba(255,255,255,0) 80%,transparent);transform:translateX(-160%) skewX(-18deg)"></div></div>`;

// house plate motion: 12 frames, opacity 0→1, scale .94→1.02→1
const plate=(t,t0,t1,out=.2)=>{const i=seg(t,t0,t0+.2),o=t1?seg(t,t1-out,t1):0;const s=i<1?(i<.6?lerp(.94,1.02,eo(i/.6)):lerp(1.02,1,eo((i-.6)/.4))):1;return {o:Math.min(1,i*1.4)*(1-o),s:s*(1-.04*o)}};

// ───────── globe (WebGL orthographic, NASA Blue Marble + GIBS detail)
const GL=$('glc').getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform sampler2D tex;uniform sampler2D det;uniform vec2 C;uniform float R;uniform vec2 L;
uniform vec3 DG;uniform vec2 DS;uniform float DON;
void main(){vec2 q=(gl_FragCoord.xy-C)/R;float r2=dot(q,q);vec3 bg=vec3(.024,.094,.165);
  if(r2>1.){float d=sqrt(r2)-1.;float g=exp(-d*R/38.)*.55+exp(-d*R/140.)*.18;gl_FragColor=vec4(bg+vec3(.35,.6,1.)*g,1.);return;}
  vec3 v=vec3(q.x,q.y,sqrt(1.-r2));float cl=cos(L.y),sl=sin(L.y);vec3 w=vec3(v.x,v.y*cl+v.z*sl,-v.y*sl+v.z*cl);
  float lon=atan(w.x,w.z)+L.x,lat=asin(clamp(w.y,-1.,1.));float fx=fract(lon/6.2831853+.5);vec2 uv=vec2(fx,.5-lat/3.1415927);
  vec3 c=texture2D(tex,uv).rgb;
  if(DON>0.){float ym=log(tan(.78539816+clamp(lat,-1.47,1.47)*.5));vec2 d=vec2((fx*DG.x-DG.y)/DS.x,((1.-ym/3.1415927)*.5*DG.x-DG.z)/DS.y);
    float wg=smoothstep(0.,.03,d.x)*smoothstep(0.,.03,1.-d.x)*smoothstep(0.,.03,d.y)*smoothstep(0.,.03,1.-d.y);c=mix(c,texture2D(det,d).rgb,wg*DON);}
  c*=1.08;float limb=pow(v.z,.35);c=c*(.55+.45*limb)+vec3(.3,.55,1.)*pow(1.-v.z,3.)*.55;gl_FragColor=vec4(c,1.);}`;
const sh=(t,src)=>{const o=GL.createShader(t);GL.shaderSource(o,src);GL.compileShader(o);if(!GL.getShaderParameter(o,GL.COMPILE_STATUS))throw new Error(GL.getShaderInfoLog(o));return o};
const PG=GL.createProgram();GL.attachShader(PG,sh(GL.VERTEX_SHADER,VS));GL.attachShader(PG,sh(GL.FRAGMENT_SHADER,FS));GL.linkProgram(PG);GL.useProgram(PG);
GL.bindBuffer(GL.ARRAY_BUFFER,GL.createBuffer());GL.bufferData(GL.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),GL.STATIC_DRAW);
const aP=GL.getAttribLocation(PG,'p');GL.enableVertexAttribArray(aP);GL.vertexAttribPointer(aP,2,GL.FLOAT,false,0,0);
const U={};['C','R','L','DG','DS','DON','tex','det'].forEach(n=>U[n]=GL.getUniformLocation(PG,n));GL.uniform1i(U.tex,0);GL.uniform1i(U.det,1);
let nLoad=0;const loaded=()=>{if(++nLoad===1+Object.keys(DET_SRC).length)window.ready=true};
const TEX=new Image();TEX.src=GLOBE_SRC;
TEX.onload=()=>{GL.activeTexture(GL.TEXTURE0);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,TEX);
  [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE));loaded()};
const DETIMG={},DETTEX={};Object.keys(DET_SRC).forEach(k=>{const im=new Image();im.onload=loaded;im.src=DET_SRC[k];DETIMG[k]=im});
function bindDet(k,on=1){if(!k||on<=0){GL.uniform1f(U.DON,0);return}
  if(!DETTEX[k]){GL.activeTexture(GL.TEXTURE1);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,DETIMG[k]);
    [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE));DETTEX[k]=t}
  GL.activeTexture(GL.TEXTURE1);GL.bindTexture(GL.TEXTURE_2D,DETTEX[k]);GL.activeTexture(GL.TEXTURE0);
  const r=DET_REF[k];GL.uniform3f(U.DG,256*2**r.z,r.X0*256,r.Y0*256);GL.uniform2f(U.DS,r.W,r.H);GL.uniform1f(U.DON,on)}
const C10=topojson.feature(WORLD10,WORLD10.objects.countries).features;
const MESH10=topojson.mesh(WORLD10,WORLD10.objects.countries,(a,b)=>a!==b);
const GPR=d3.geoOrthographic().clipAngle(90).precision(.3),GPATH=d3.geoPath(GPR);
const P=ll=>GPR(ll)||[-999,-999];
const visible=(ll,c)=>d3.geoDistance(ll,[c.lon,c.lat])<Math.PI/2-.05;
function fit(lo0,lo1,la0,la1,rect){const pts=[];for(let i=0;i<=24;i++){const f=i/24;pts.push([lerp(lo0,lo1,f),la0],[lerp(lo0,lo1,f),la1],[lo0,lerp(la0,la1,f)],[lo1,lerp(la0,la1,f)])}
  const lon=(lo0+lo1)/2,lat=(la0+la1)/2,pr=d3.geoOrthographic().rotate([-lon,-lat]).fitExtent(rect,{type:'MultiPoint',coordinates:pts});return {lon,lat,R:pr.scale(),tx:pr.translate()[0],ty:pr.translate()[1]}}
function slerp(a,b,u){const r=Math.PI/180,va=[Math.cos(a[1]*r)*Math.cos(a[0]*r),Math.cos(a[1]*r)*Math.sin(a[0]*r),Math.sin(a[1]*r)],vb=[Math.cos(b[1]*r)*Math.cos(b[0]*r),Math.cos(b[1]*r)*Math.sin(b[0]*r),Math.sin(b[1]*r)];
  const d=Math.acos(clamp(va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2],-1,1));if(d<1e-6)return a;const s1=Math.sin((1-u)*d)/Math.sin(d),s2=Math.sin(u*d)/Math.sin(d);
  const v=va.map((x,i)=>x*s1+vb[i]*s2);return [Math.atan2(v[1],v[0])/r,Math.asin(clamp(v[2],-1,1))/r]}
const mix=(A,B,u)=>{const e=eio(u),c=slerp([A.lon,A.lat],[B.lon,B.lat],e);return {lon:c[0],lat:c[1],R:Math.exp(lerp(Math.log(A.R),Math.log(B.R),e)),tx:lerp(A.tx,B.tx,e),ty:lerp(A.ty,B.ty,e)}};
const dipMix=(A,B,u)=>{const e=eio(u),c=slerp([A.lon,A.lat],[B.lon,B.lat],e),la=Math.log(A.R),lb=Math.log(B.R),dip=Math.max(0,Math.max(la,lb)-Math.log(1300))*.55+.12;
  return {lon:c[0],lat:c[1],R:Math.exp(lerp(la,lb,e)-dip*Math.sin(Math.PI*e)),tx:lerp(A.tx,B.tx,e),ty:lerp(A.ty,B.ty,e)}};

// ───────── places
const CITY={cal:[-114.07,51.05],des:[-86.5,30.39],van:[-123.12,49.28],sea:[-122.33,47.61]};
const MAPR=[[60,400],[1020,1380]];
const VW=fit(-131,-63,23,60,MAPR);
const VCD=fit(-120,-80,26.5,55,[[110,560],[970,1360]]);
const VPN=fit(-125.3,-120.6,47.05,49.75,[[40,440],[700,1040]]);
const VCA=fit(-141,-85,41,69,[[50,390],[1030,1160]]);
const START={R:400,lat:28,tx:540,ty:880};
const SPIN=25,T2=2,TD=1.3,ALON=VW.lon,L2=ALON-SPIN*TD/2,L0=L2-SPIN*T2;
const spinLon=t=>t<T2?L2-SPIN*(T2-t):t<T2+TD?L2+SPIN*(t-T2)-SPIN/(2*TD)*(t-T2)**2:ALON;
const DUR=70;
function camera(t){
  if(t<T2)return {...START,lon:spinLon(t)};
  if(t<5){const u=eio(seg(t,T2,5)),ul=eio(seg(t,2.4,5));return {lon:lerp(spinLon(t),VW.lon,ul),lat:lerp(START.lat,VW.lat,u),R:Math.exp(lerp(Math.log(START.R),Math.log(VW.R),u)),tx:lerp(START.tx,VW.tx,u),ty:lerp(START.ty,VW.ty,u)}}
  if(t<14)return VW;
  if(t<16)return dipMix(VW,VCD,seg(t,14,16));
  if(t<25)return VCD;
  if(t<27)return dipMix(VCD,VPN,seg(t,25,27));
  if(t<47)return VPN;
  if(t<48.6)return dipMix(VPN,VCA,seg(t,47,48.6));
  if(t<62.5)return VCA;
  if(t<65.5)return mix(VCA,VW,seg(t,62.5,65.5));
  if(t<67.8)return VW;
  const u=eio(seg(t,67.8,69.9));return {lon:lerp(VW.lon,L0-SPIN*(DUR-t),u),lat:lerp(VW.lat,START.lat,u),R:Math.exp(lerp(Math.log(VW.R),Math.log(START.R),u)),tx:lerp(VW.tx,START.tx,u),ty:lerp(VW.ty,START.ty,u)}}

// ───────── zone colours by UTC offset (translucent, never the city blue / orange)
const ZC={'-10':[150,160,182],'-9':[196,156,255],'-8':[255,122,180],'-7':[255,214,74],'-6':[86,214,146],'-5':[64,204,214],'-4':[168,140,255],'-3.5':[214,219,230],'-3':[214,219,230],'-2.5':[214,219,230]};
const mixc=(a,b,u)=>a.map((v,i)=>Math.round(v+(b[i]-v)*u));
// 0 = summer clocks (Oct 2026 / spring 2027), 1 = winter clocks after 1 Nov 2026
function phase(t){if(t<10.8)return 0;if(t<12.4)return eio(seg(t,10.8,12.4));if(t<47.2)return 1;if(t<48.2)return 1-eio(seg(t,47.2,48.2));if(t<A.moved)return 0;if(t<A.moved+1.6)return eio(seg(t,A.moved,A.moved+1.6));if(t<A.fwd)return 1;return 1-eio(seg(t,A.fwd,A.fwd+1.6))}
const usChange=f=>f.properties.s!==f.properties.w;
// d3 wants clockwise exteriors and counter-clockwise holes: fix any ring that would cover the rest of the sphere
const ringA=r=>d3.geoArea({type:'Polygon',coordinates:[r]});
const fixPoly=pl=>pl.map((r,i)=>{const big=ringA(r)>2*Math.PI;return (i===0?big:!big)?r.slice().reverse():r});
[...TZ.features,...PROV.features].forEach(f=>{const g=f.geometry;if(g.type==='Polygon')g.coordinates=fixPoly(g.coordinates);else if(g.type==='MultiPolygon')g.coordinates=g.coordinates.map(fixPoly)});
const PROVF={};PROV.features.forEach(f=>PROVF[f.properties.k]=f);
const fmtU=o=>'UTC'+(o<0?'−':'+')+String(Math.abs(o)).replace('.5',':30');

// ───────── voice words (placeholder timing until the recording arrives)
const KEY=/^(Canada|America|west|November|twenty-six|Calgary|Destin|Florida|ten|Vancouver|Seattle|hour|four-hour|noon|three|five|British|Columbia|Alberta|Manitoba|Northwest|Territories|summer|spring|disappear|Geography|clocks|Different|Same)/i;
const WORDS=WV.map(([li,txt,t])=>({txt,t,li,key:KEY.test(txt)}));
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1],len=cur.reduce((s,x)=>s+x.txt.length+1,0);if(/[.?!,—:]$/.test(w.txt)&&len>=14||len>=28||!nx||nx.li!==w.li){CH.push(cur);cur=[]}})}
CH.forEach((c,i)=>{const nx=CH[i+1];c.t0=c[0].t;c.t1=nx&&nx[0].li===c[0].li?nx[0].t-.02:BV[c[0].li][1]+.3});
const lc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),LB=[157,182,234],NV=[43,58,103],BK=[17,18,24],BLc=[47,123,245],GR=[150,156,170];

 van:wt(5,'vancouver'),sea:wt(5,'seattle'),b6:BV[6][0],hour:wt(6,'hour'),b7:BV[7][0],leave:wt(8,'leave'),three:wt(8,'three'),rev:wt(9,'reverse'),five:wt(9,'five'),b10:BV[10][0],
 bc:wt(11,'british'),ab:wt(11,'alberta'),mb:wt(11,'manitoba'),nt:wt(11,'northwest'),kept:wt(11,'kept'),moved:wt(11,'moved'),e11:BV[11][1],
 b12:BV[12][0],fwd:wt(12,'forward'),mis:wt(12,'mismatches'),dis:wt(12,'disappear'),b13:BV[13][0],clocks:wt(13,'clocks')};

  const a=el.querySelector('.a'),b=el.querySelector('.b');const sz=el.querySelector('.sz');const lg=String(from).length>String(to).length?from:to;if(sz.textContent!==lg)sz.textContent=lg;const e=eio(clamp(u));

// ───────── SVG helpers
const pinSvg=(x,y,col,rise,lab,side='r',o=1)=>{const yy=y-14*rise;return `<g opacity="${o}"><ellipse cx="${x}" cy="${y+4}" rx="16" ry="6" fill="#000" opacity=".35"/><g transform="translate(${x} ${yy})"><path d="M0 0 C-10 -16 -30 -30 -30 -52 A30 30 0 1 1 30 -52 C30 -30 10 -16 0 0Z" fill="${col}" stroke="#fff" stroke-width="5"/><circle cy="-52" r="11" fill="#fff"/></g>
  ${lab?`<g transform="translate(${x+(side==='r'?44:-44)} ${yy-52})"><rect x="${side==='r'?0:-(lab.length*20+40)}" y="-28" width="${lab.length*20+40}" height="56" rx="28" fill="#fff"/><text x="${side==='r'?20:-20}" y="11" font-size="31" font-weight="900" fill="${col}" text-anchor="${side==='r'?'start':'end'}" font-family="Inter Display,Inter">${lab}</text></g>`:''}</g>`};
function dial(cx,cy,r,hDeg,mDeg,o=1,lock=0,ring='#111218'){if(o<=0)return'';let s=`<g opacity="${o}" transform="translate(${cx} ${cy})"><circle r="${r+8}" fill="#fff" stroke="${ring}" stroke-opacity=".12" stroke-width="2"/><circle r="${r}" fill="#fff" stroke="#e3e7ef" stroke-width="3"/>`;
  for(let i=0;i<12;i++){const a=i*Math.PI/6,l=i%3?.88:.8;s+=`<line x1="${(Math.sin(a)*r*l).toFixed(1)}" y1="${(-Math.cos(a)*r*l).toFixed(1)}" x2="${(Math.sin(a)*r*.95).toFixed(1)}" y2="${(-Math.cos(a)*r*.95).toFixed(1)}" stroke="#111218" stroke-width="${i%3?3:6}" stroke-linecap="round"/>`}
  s+=`<line x1="0" y1="0" x2="${(Math.sin(mDeg*Math.PI/180)*r*.78).toFixed(1)}" y2="${(-Math.cos(mDeg*Math.PI/180)*r*.78).toFixed(1)}" stroke="#111218" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<line x1="0" y1="0" x2="${(Math.sin(hDeg*Math.PI/180)*r*.52).toFixed(1)}" y2="${(-Math.cos(hDeg*Math.PI/180)*r*.52).toFixed(1)}" stroke="${BLUE}" stroke-width="11" stroke-linecap="round"/><circle r="9" fill="#111218"/>`;
