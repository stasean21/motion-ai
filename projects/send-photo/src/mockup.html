<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What happens when you send a photo — keyframes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f4eef6}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#0d0d12}
#root{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.blob{position:absolute;width:1400px;height:1400px;border-radius:50%}
.card{position:absolute;background:linear-gradient(180deg,#fff 0%,#f7f6fb 100%);border-radius:56px;overflow:hidden;
  box-shadow:0 60px 110px -34px rgba(48,32,110,.40),0 20px 40px -14px rgba(48,32,110,.18),inset 0 2px 0 #fff,inset 0 -4px 10px rgba(40,30,90,.05)}
.sq{display:flex;align-items:center;justify-content:center}
.pill{border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.sub{position:absolute;left:60px;width:960px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.25em;font-weight:800;font-size:68px;line-height:1.12;letter-spacing:-.022em}
.sub .g{opacity:.2;filter:blur(8px)}
.cap{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:.95;text-align:center;white-space:nowrap}
.mono{font-family:'DejaVu Sans Mono',monospace}
/* phone */
.phone{position:absolute;width:600px;height:1240px;border-radius:96px;background:linear-gradient(160deg,#3a3a44,#121217 60%,#2a2a33);padding:18px;
  box-shadow:0 80px 140px -40px rgba(40,25,100,.55),0 30px 60px -20px rgba(40,25,100,.3),inset 0 0 0 3px #4a4a55,inset 0 0 0 7px #0c0c10}
.screen{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;background:#fbfaff}
.island{position:absolute;left:50%;top:22px;width:170px;height:50px;margin-left:-85px;border-radius:25px;background:#08080b;z-index:5}
.blk{position:absolute;width:150px;height:150px;border-radius:36px;background:linear-gradient(150deg,#7ff0df 0%,#2dd4bf 45%,#0fa3a0 100%);
  box-shadow:0 26px 50px -16px rgba(13,148,136,.6),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(0,80,80,.25);color:#fff}
.blk .n{position:absolute;left:20px;top:16px;font-weight:900;font-size:46px;letter-spacing:-.03em}
.blk .bits{position:absolute;left:20px;bottom:18px;font-size:15px;opacity:.85;line-height:1.25}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const root=document.getElementById('root');
const CAT='assets/cat.webp';
const IC={
  wifi:'<path d="M2.5 9.2a14 14 0 0 1 19 0"/><path d="M5.8 12.6a9.2 9.2 0 0 1 12.4 0"/><path d="M9.1 16a4.4 4.4 0 0 1 5.8 0"/><circle cx="12" cy="19.4" r="1.2" fill="currentColor"/>',
  tower:'<path d="M12 9v12M8 21l4-12 4 12M9.3 16.5h5.4"/><circle cx="12" cy="7" r="1.6"/><path d="M8.2 3.8a5.4 5.4 0 0 0 0 6.4M15.8 3.8a5.4 5.4 0 0 1 0 6.4M5.6 1.8a9 9 0 0 0 0 10.4M18.4 1.8a9 9 0 0 1 0 10.4"/>',
  chat:'<path d="M4 6.4A2.4 2.4 0 0 1 6.4 4h11.2A2.4 2.4 0 0 1 20 6.4v7.8a2.4 2.4 0 0 1-2.4 2.4H10l-4.6 3.6v-3.6A2.4 2.4 0 0 1 4 14.2z"/>',
  send:'<path d="M12 19.5V5M5.6 11.2L12 4.8l6.4 6.4"/>',
  check:'<path d="M5 12.6l4.3 4.3L19.2 7"/>',
  tap:'<circle cx="12" cy="9" r="3"/><path d="M6.5 9a5.5 5.5 0 0 1 11 0"/><path d="M12 12v8"/>',
  box:'<path d="M3.6 7.6L12 3.4l8.4 4.2v8.8L12 20.6l-8.4-4.2z"/><path d="M3.6 7.6L12 11.8l8.4-4.2M12 11.8v8.8"/>',
};
const ell2=0;const icon=(n,s,c,sw=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" color="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

function bg(base,c){return `<div class="abs" style="inset:0;background:${base}">${[[150,300],[920,760],[180,1500],[900,1680]].map((p,i)=>`<div class="blob" style="left:${p[0]-700}px;top:${p[1]-700}px;background:radial-gradient(circle,${c[i]} 0%,${c[i]}00 68%)"></div>`).join('')}</div>`}
function dust(n=30){let s='';for(let i=0;i<n;i++){const h=k=>{const x=Math.sin((i+k)*127.1+311.7)*43758.5453;return x-Math.floor(x)};const r=3+h(1)*6;s+=`<div class="abs" style="left:${h(2)*1080}px;top:${h(3)*1920}px;width:${r}px;height:${r}px;border-radius:50%;background:#fff;opacity:${.3+h(4)*.5};box-shadow:0 0 ${r*2}px #fff"></div>`}return s}
// subtitle: words, number revealed, key word index → colour
function sub(text,revealed,key={},y=330,ring={}){const w=text.split(' ');return `<div class="sub" style="top:${y}px">${w.map((x,i)=>`<span class="${i<revealed?'':'g'}" ${(key[i]&&i<revealed&&ring[i]!==0)?`data-k="${key[i]}"`:''} style="color:${key[i]||'#0d0d12'}">${x}</span>`).join('')}</div>`}
function ell(x,y,w,h,c){return `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M8 24C6 12 30 4 56 5c26 1 40 8 38 18-2 10-28 15-50 14C20 36 4 30 10 18" fill="none" stroke="${c}" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:3.5px;opacity:.8"/></svg>`}

// ── chat screens
function chatHeader(name,av){return `<div class="abs" style="left:0;top:0;width:100%;height:190px;background:rgba(255,255,255,.92);border-bottom:2px solid #efeef4;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px">
  <div style="text-align:center"><div class="sq" style="width:76px;height:76px;margin:0 auto;border-radius:50%;background:${av};color:#fff;font-weight:900;font-size:36px">${name[0]}</div>
  <div style="font-weight:700;font-size:24px;margin-top:8px">${name} ›</div></div></div>`}
function composer(withPhoto){return `
  ${withPhoto?`<div class="abs" style="left:28px;right:28px;bottom:150px;height:520px;border-radius:40px;background:#f1f0f6;padding:22px">
     <div style="position:relative;width:300px;height:430px;border-radius:30px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.35)"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover">
       <div class="sq" style="position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:26px;font-weight:700">×</div></div>
     <div style="position:absolute;left:345px;top:30px;font-weight:700;font-size:26px">cat.jpg</div>
     <div style="position:absolute;left:345px;top:68px;font-weight:600;font-size:22px;color:#8b8a97">1 photo selected</div></div>`:''}
  <div class="abs" style="left:28px;bottom:40px;width:350px;height:92px;border-radius:46px;background:#f1f0f6;display:flex;align-items:center;padding-left:30px;color:#a5a4b0;font-weight:600;font-size:28px">Message</div>
  <div class="abs pill" id="sendBtn" style="right:28px;bottom:40px;width:170px;height:92px;background:linear-gradient(160deg,#ffae4a,#ff6a00);color:#fff;font-weight:900;font-size:32px;gap:8px;box-shadow:0 14px 30px -8px rgba(255,110,0,.6)">Send ${icon('send',30,'#fff',3)}</div>`}
function phone(inner,x,y,s=1,rot='',extra=''){return `<div class="phone" style="left:${x-300}px;top:${y-620}px;transform:perspective(2200px) ${rot} scale(${s});${extra}"><div class="screen"><div class="island"></div>${inner}</div></div>`}
function finger(x,y,s=1,press=0){return `<svg class="abs" id="finger" data-s="${s}" style="left:${x}px;top:${y}px;transform:rotate(-24deg) scale(${s});transform-origin:105px 30px;filter:drop-shadow(0 30px 30px rgba(60,30,40,.35))" width="210" height="520" viewBox="0 0 210 520">
  <defs><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#e9a983"/><stop offset=".5" stop-color="#f7cdb2"/><stop offset="1" stop-color="#df9874"/></linearGradient>
  <linearGradient id="nl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3d8"/><stop offset="1" stop-color="#efbfae"/></linearGradient></defs>
  <path d="M40 520 L30 130 Q30 22 105 22 Q180 22 180 130 L176 520 Z" fill="url(#sk)"/>
  <path d="M66 86 Q105 40 144 86 L140 168 Q105 182 70 168 Z" fill="url(#nl)" stroke="#d99a83" stroke-width="2"/>
  <path d="M70 270 Q105 282 140 270M74 300 Q105 310 136 300" stroke="#c9876a" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/></svg>`}
function blk(x,y,n,s=1,r=0,o=1,blur=0){return `<div class="blk" style="left:${x-75}px;top:${y-75}px;transform:rotate(${r}deg) scale(${s});opacity:${o};filter:${blur?`blur(${blur}px)`:'none'}">
  <div class="n">${n}</div><div class="bits mono">1011 0110<br>0100 1101</div></div>`}

// ── frames
const F={};
F['1a']=()=>bg('#f7efe9',['#ffc28c','#ff9fcf','#b8a3ff','#ffe39a'])+dust()+
  sub('You tap Send.',3,{2:'#FF7A1A'})+
  phone(chatHeader('Alex','linear-gradient(160deg,#7aa2ff,#4f6bff)')+composer(true),540,1040,1.0,'rotateX(10deg) rotateY(-16deg) rotateZ(2deg)')+finger(0,0,1.25);

F['1b']=()=>bg('#f6eef8',['#ffc9a0','#c9b2ff','#a9c8ff','#ffd2e6'])+dust()+
  sub('But how does this photo actually reach your friend?',6,{})+
  phone(chatHeader('Alex','linear-gradient(160deg,#7aa2ff,#4f6bff)')+
    `<div class="abs" style="right:28px;top:520px;width:300px;height:430px;border-radius:34px 34px 10px 34px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.3)"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover"></div>
     <div class="abs" style="right:34px;top:962px;font-weight:600;font-size:22px;color:#8b8a97">Sending…</div>`+composer(false),250,1330,.62,'rotateY(14deg)')+
  phone(chatHeader('Sam','linear-gradient(160deg,#ffae4a,#ff6a00)')+composer(false),830,1330,.62,'rotateY(-14deg)')+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M410 1320 C 500 1260, 580 1260, 670 1320" stroke="#2dd4bf" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="2 16"/>
   ${[[470,1280],[540,1270],[610,1282]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#2dd4bf"/>`).join('')}</svg>`+
  `<div class="abs" style="left:478px;top:1178px;width:124px;height:176px;border-radius:22px;overflow:hidden;transform:rotate(-6deg);box-shadow:0 20px 40px -10px rgba(40,30,110,.45);border:5px solid #fff"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover"></div>`+
  `<div class="cap" style="left:0;width:1080px;top:560px;font-size:104px">HOW DOES IT<br>GET <span style="color:#14b8a6">THERE?</span></div>`;

F['2']=()=>bg('#ebf8f6',['#9ff0e2','#b9d4ff','#d6c4ff','#c7f5e9'])+dust()+
  sub('Imagine numbered parcels carrying the information',2,{1:'#0FA3A0'})+
  // file icon with data lines
  `<div class="card" style="left:90px;top:640px;width:330px;height:410px;border-radius:44px;transform:rotate(-6deg)">
     <div class="abs" style="right:0;top:0;width:90px;height:90px;background:linear-gradient(225deg,#e8e7ef 50%,transparent 50%)"></div>
     <div class="abs mono" style="left:36px;top:110px;font-size:21px;line-height:1.55;color:#0fa3a0;font-weight:700">01001010 1101<br>11010010 0110<br>00110111 1011<br>10101100 0011<br>01110001 1100<br>11001010 0101</div>
     <div class="abs" style="left:36px;top:46px;font-weight:900;font-size:30px">cat.jpg</div></div>`+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M300 1080 C 420 1240, 700 1180, 820 1420 S 760 1700, 900 1860" stroke="#2dd4bf" stroke-width="5" fill="none" opacity=".35" stroke-dasharray="3 18" stroke-linecap="round"/></svg>`+
  blk(470,1010,'02',.62,8)+blk(620,1120,'03',.7,-6)+blk(790,1230,'04',.66,10)+blk(880,1440,'05',.6,-4,.9)+blk(860,1650,'06',.55,6,.75,2)+
  // parcels
  `<div class="abs" style="left:400px;top:1150px;transform:rotate(-8deg)"><div class="sq" style="width:160px;height:140px;border-radius:22px;background:linear-gradient(160deg,#f5d3a3,#e1aa6a);box-shadow:0 20px 40px -12px rgba(120,70,20,.45);position:relative">
     <div style="position:absolute;left:66px;top:0;width:28px;height:100%;background:#d39752;opacity:.6"></div>
     <div style="position:absolute;left:18px;top:62px;padding:6px 12px;border-radius:10px;background:#fff;font-weight:900;font-size:24px;color:#0fa3a0">03</div></div></div>`+
  // hero block close to camera
  `<div class="blk" style="left:170px;top:1250px;width:400px;height:400px;border-radius:90px;transform:rotate(-10deg)"><div class="n" style="left:50px;top:40px;font-size:130px">01</div>
     <div class="bits mono" style="left:52px;bottom:50px;font-size:30px">1011 0110 1100<br>0100 1101 0011</div></div>`+
  `<div class="pill" style="position:absolute;left:560px;top:1300px;height:76px;padding:0 30px;background:#fff;box-shadow:0 16px 34px -12px rgba(13,148,136,.5);font-weight:900;font-size:32px;color:#0d0d12;gap:12px"><span class="mono" style="color:#0fa3a0">01</span> / DATA</div>`+
  `<div class="cap" style="left:0;width:1080px;top:520px;font-size:120px;color:#0d0d12">DATA <span style="color:#0fa3a0">PACKETS</span></div>`;

F['3']=()=>{
  const nodes=[[300,1150],[700,1010],[380,860]];
  return bg('#eef1fb',['#a8c6ff','#9ff0e2','#d2c2ff','#bfe2ff'])+dust()+
  sub('Routers pass them between networks,',2,{0:'#3D6BFF'})+
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920">
    <path d="M250 1560 C 330 1480, 450 1440, 540 1390" stroke="#2dd4bf" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M250 1560 C 500 1600, 760 1560, 860 1480" stroke="#b9b8c8" stroke-width="6" fill="none" stroke-dasharray="4 16" stroke-linecap="round"/>
    <path d="M540 1390 C 420 1320, 300 1250, 300 1150 S 600 1060, 700 1010 S 420 900, 380 860 S 620 720, 720 690" stroke="#2dd4bf" stroke-width="10" fill="none" stroke-linecap="round"/>
    ${[[880,980],[160,940],[860,1240],[180,1330]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="20" fill="#fff" stroke="#c9c7da" stroke-width="5"/>`).join('')}
    <path d="M300 1150 L160 940 M700 1010 L880 980 M700 1010 L860 1240 M300 1150 L180 1330" stroke="#c9c7da" stroke-width="4"/>
  </svg>`+
  nodes.map((p,i)=>`<div class="sq" style="position:absolute;left:${p[0]-48}px;top:${p[1]-48}px;width:96px;height:96px;border-radius:50%;background:${i==1?'#3d6bff':'#fff'};box-shadow:0 ${i==1?'0 0 0 18px rgba(61,107,255,.18),':''}0 16px 30px -10px rgba(40,40,120,.4)"><div style="width:30px;height:30px;border-radius:50%;background:${i==1?'#fff':'#3d6bff'}"></div></div>`).join('')+
  phone(chatHeader('Alex','linear-gradient(160deg,#7aa2ff,#4f6bff)')+`<div class="abs" style="right:28px;top:520px;width:300px;height:430px;border-radius:34px;overflow:hidden"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover"></div>`+composer(false),180,1560,.28,'rotateY(18deg)')+
  `<div class="card sq" style="left:450px;top:1300px;width:180px;height:180px;border-radius:48px;flex-direction:column;gap:6px;box-shadow:0 0 0 14px rgba(45,212,191,.22),0 30px 60px -20px rgba(40,32,110,.45)">${icon('wifi',86,'#0fa3a0',2.2)}<div style="font-weight:800;font-size:22px">Wi-Fi</div></div>`+
  `<div class="card sq" style="left:790px;top:1400px;width:150px;height:150px;border-radius:40px;flex-direction:column;gap:4px;opacity:.55;filter:blur(2.5px);transform:scale(.9)">${icon('tower',70,'#8b8a97',2)}<div style="font-weight:800;font-size:20px;color:#8b8a97">Mobile</div></div>`+
  // servers
  `<div class="card" style="left:590px;top:540px;width:300px;height:250px;border-radius:46px;padding:30px">
     ${[0,1,2].map(i=>`<div style="height:46px;margin-bottom:14px;border-radius:14px;background:#f0eff6;display:flex;align-items:center;gap:10px;padding:0 16px"><i style="width:12px;height:12px;border-radius:50%;background:#16c060"></i><i style="width:12px;height:12px;border-radius:50%;background:#2dd4bf"></i><i style="flex:1;height:8px;border-radius:4px;background:#dcdbe6"></i></div>`).join('')}
     <div class="sq" style="position:absolute;right:-6px;top:-6px;width:84px;height:84px;border-radius:26px;background:linear-gradient(160deg,#ffae4a,#ff6a00);box-shadow:0 12px 24px -8px rgba(255,110,0,.6)">${icon('chat',46,'#fff',2.2)}</div></div>`+
  blk(470,1240,'01',.42,-8)+blk(330,1010,'02',.36,6,.85)+
  `<div class="abs" style="left:640px;top:1100px;font-weight:900;font-size:22px;letter-spacing:.1em;color:#8b8a97">NODE</div>`+
  `<div class="cap" style="left:470px;top:960px;font-size:96px;text-align:left;transform:translateX(330px) translateX(-100%)"></div>`+
  `<div class="cap" style="left:140px;top:1720px;width:800px;font-size:118px;color:#3d6bff">ROUTERS</div>`;};

F['4']=()=>`<div class="abs" style="inset:0;background:linear-gradient(180deg,#e9f6ff 0%,#bfe6f3 18%,#7ccbe0 45%,#3e9fc0 75%,#2a7fa6 100%)"></div>`+
  // light rays
  `<div class="abs" style="inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 90px,rgba(255,255,255,.14) 90px 150px,rgba(255,255,255,0) 150px 260px);mask-image:linear-gradient(180deg,#000 10%,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 70%)"></div>`+
  `<svg class="abs" style="left:0;top:500px" width="1080" height="80" viewBox="0 0 1080 80"><path d="M0 40 Q 90 10 180 40 T 360 40 T 540 40 T 720 40 T 900 40 T 1080 40 V0 H0Z" fill="rgba(255,255,255,.55)"/></svg>`+
  `<div class="abs" style="left:-100px;top:1580px;width:1300px;height:500px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#f3dfb5,#d9bd88)"></div>`+
  [...Array(18)].map((_,i)=>{const h=k=>{const x=Math.sin((i+k)*91.7)*43758.5;return x-Math.floor(x)};const r=6+h(1)*14;return `<div class="abs" style="left:${h(2)*1080}px;top:${600+h(3)*1000}px;width:${r}px;height:${r}px;border-radius:50%;border:2px solid rgba(255,255,255,.6)"></div>`}).join('')+
  sub('carried by pulses of light.',5,{2:'#0E7490',3:'#0E7490',4:'#0E7490'},330,{2:0,3:0})+
  // cable with cutaway
  `<svg class="abs" style="left:0;top:0" width="1080" height="1920">
     <defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6170"/><stop offset=".45" stop-color="#2a2f3a"/><stop offset="1" stop-color="#151820"/></linearGradient>
       <linearGradient id="in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3b4d"/><stop offset="1" stop-color="#0b1a24"/></linearGradient>
       <filter id="gl"><feGaussianBlur stdDeviation="6"/></filter></defs>
     <g transform="rotate(-14 540 1300)">
       <rect x="-200" y="1210" width="1500" height="200" rx="100" fill="url(#sh)"/>
       <rect x="260" y="1210" width="560" height="200" fill="url(#in)"/>
       <ellipse cx="260" cy="1310" rx="34" ry="100" fill="#3a4050" stroke="#8a90a0" stroke-width="4"/>
       <ellipse cx="820" cy="1310" rx="34" ry="100" fill="#3a4050" stroke="#8a90a0" stroke-width="4"/>
       ${[0,1,2,3,4,5].map(i=>{const y=1252+i*23;return `<line x1="230" y1="${y}" x2="850" y2="${y}" stroke="#7fd6ff" stroke-width="5" opacity=".55"/>`}).join('')}
       <line x1="430" y1="1298" x2="640" y2="1298" stroke="#e8fbff" stroke-width="14" stroke-linecap="round" filter="url(#gl)"/>
       <line x1="470" y1="1298" x2="640" y2="1298" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
       <circle cx="640" cy="1298" r="26" fill="#fff" filter="url(#gl)"/>
       <line x1="300" y1="1344" x2="400" y2="1344" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
       <line x1="680" y1="1275" x2="760" y2="1275" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
     </g></svg>`+
  `<div class="pill" style="position:absolute;left:600px;top:1060px;height:72px;padding:0 28px;background:rgba(255,255,255,.9);font-weight:900;font-size:28px;color:#0e7490;gap:10px;box-shadow:0 14px 30px -10px rgba(0,60,90,.4)">FIBER · LIGHT</div>`+
