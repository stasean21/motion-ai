<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What happens when you send a photo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f5f5f7}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#0d0d12}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.sbg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(120% 60% at 50% 0%,#ffffff 0%,#f5f5f7 55%,#ececf0 100%)}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.blob{position:absolute;left:0;top:0;width:1400px;height:1400px;border-radius:50%;opacity:.42}
.sq{display:flex;align-items:center;justify-content:center}
.cap{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:.95;text-align:center;white-space:nowrap}
.cap .ln{display:block}
.mono{font-family:'DejaVu Sans Mono',monospace}
/* Liquid Glass (approved mockup v5) */
.card{position:absolute;border-radius:56px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.30) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);border:1.5px solid rgba(255,255,255,.8);
  box-shadow:0 34px 70px -26px rgba(30,30,70,.28),0 8px 20px -8px rgba(30,30,70,.10),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(255,255,255,.55),
    inset 14px 18px 34px -16px rgba(255,255,255,.85),inset -14px -18px 36px -16px rgba(110,130,190,.28)}
.card::before,.blk::before,.pill::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 68%,rgba(255,255,255,.28) 100%)}
.blk{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:36px;color:#065f5b;overflow:hidden;
  background:linear-gradient(150deg,rgba(150,245,230,.62) 0%,rgba(45,212,191,.42) 50%,rgba(13,160,155,.55) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(1.9);backdrop-filter:blur(16px) saturate(1.9);border:1.5px solid rgba(255,255,255,.75);
  box-shadow:0 26px 50px -18px rgba(13,148,136,.45),inset 0 2px 0 rgba(255,255,255,.9),inset 10px 12px 26px -12px rgba(255,255,255,.8),inset -10px -14px 26px -12px rgba(0,90,90,.25)}
.blk .n{position:absolute;left:20px;top:16px;font-weight:900;font-size:46px;letter-spacing:-.03em}
.blk .bits{position:absolute;left:20px;bottom:18px;font-size:15px;opacity:.85;line-height:1.25}
.blk .parcel{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,#f5d3a3,#e1aa6a);opacity:0}
.blk .parcel i{position:absolute;left:62px;top:0;width:26px;height:100%;background:#d39752;opacity:.6}
.blk .parcel b{position:absolute;left:16px;top:58px;padding:5px 12px;border-radius:10px;background:#fff;font-weight:900;font-size:26px;color:#0fa3a0}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;
  background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 16px 34px -14px rgba(20,40,80,.3),inset 0 2px 0 rgba(255,255,255,.95),inset 8px 10px 20px -10px rgba(255,255,255,.8)}
.sendBtn{position:absolute;right:28px;bottom:40px;width:170px;height:92px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:32px;
  background:linear-gradient(160deg,rgba(255,170,80,.92),rgba(255,106,0,.82));border:1.5px solid rgba(255,255,255,.65);
  box-shadow:0 14px 30px -10px rgba(255,110,0,.55),inset 0 2px 0 rgba(255,255,255,.7),inset 8px 10px 18px -10px rgba(255,255,255,.6)}
/* phone */
.phone{position:absolute;width:600px;height:1240px;border-radius:96px;background:linear-gradient(160deg,#3a3a44,#121217 60%,#2a2a33);padding:18px;
  box-shadow:0 80px 140px -40px rgba(40,25,100,.55),0 30px 60px -20px rgba(40,25,100,.3),inset 0 0 0 3px #4a4a55,inset 0 0 0 7px #0c0c10}
.screen{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;background:#fbfaff}
.island{position:absolute;left:50%;top:22px;width:170px;height:50px;margin-left:-85px;border-radius:25px;background:#08080b;z-index:5}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:.045;mix-blend-mode:overlay;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="grain" width="540" height="960"></canvas>
<script>
'use strict';
// ───────────────────────── utilities
const FPS=60,DUR=55;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={lin:p=>p,out:p=>1-Math.pow(1-p,3),in:p=>p*p*p,io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  outQ:p=>1-Math.pow(1-p,5),outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),inExpo:p=>p<=0?0:Math.pow(2,10*p-10),
  back:p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  spring:p=>p>=1?1:1-Math.exp(-6.5*p)*Math.cos(10*p),sine:p=>.5-.5*Math.cos(Math.PI*p)};
function mixObj(a,b,p){const o={};for(const k in b){const va=a[k]??b[k];o[k]=typeof b[k]==='number'?lerp(va,b[k],p):(p<.5?va:b[k])}for(const k in a)if(!(k in o))o[k]=a[k];return o}
function kf(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){const [t1,v1,e]=keys[i];if(t<=t1){const [t0,v0]=keys[i-1];const p=(E[e||'io'])(prog(t,t0,t1));return typeof v1==='number'?lerp(v0,v1,p):mixObj(v0,v1,p)}}return keys[keys.length-1][1]}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mixHex(a,b,p){const A=hex2rgb(a),B=hex2rgb(b);return A.map((v,i)=>Math.round(lerp(v,B[i],p)))}
const $=id=>document.getElementById(id);
function mk(parent,html){const d=document.createElement('div');d.innerHTML=html.trim();const el=d.firstElementChild;parent.appendChild(el);return el}
// center-anchored element: transform from its own centre
function C(el,{x=0,y=0,s=1,o=1,blur=0,sx,sy}){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${sx??s},${sy??s})`;vis(el,o,blur)}
// statically positioned element: extra offset + scale around centre
function T(el,{dx=0,dy=0,s=1,o=1,blur=0}){el.style.transform=`translate(${dx}px,${dy}px) scale(${s*(+el.dataset.base||1)})`;vis(el,o,blur)}
function vis(el,o,blur){el.style.opacity=o;el.style.visibility=o<=.004?'hidden':'visible';el.style.filter=blur>.1?`blur(${blur.toFixed(1)}px)`:'none'}
function cam(el,{x=540,y=960,z=1,sx=540,sy=960}){el.style.transform=`translate(${sx}px,${sy}px) scale(${z}) translate(${-x}px,${-y}px)`}

// ───────────────────────── assets / builders (same visuals as approved mockup)
const CAT='assets/cat.webp';
const IC={
  wifi:'<path d="M2.5 9.2a14 14 0 0 1 19 0"/><path d="M5.8 12.6a9.2 9.2 0 0 1 12.4 0"/><path d="M9.1 16a4.4 4.4 0 0 1 5.8 0"/><circle cx="12" cy="19.4" r="1.2" fill="currentColor"/>',
  tower:'<path d="M12 9v12M8 21l4-12 4 12M9.3 16.5h5.4"/><circle cx="12" cy="7" r="1.6"/><path d="M8.2 3.8a5.4 5.4 0 0 0 0 6.4M15.8 3.8a5.4 5.4 0 0 1 0 6.4M5.6 1.8a9 9 0 0 0 0 10.4M18.4 1.8a9 9 0 0 1 0 10.4"/>',
  chat:'<path d="M4 6.4A2.4 2.4 0 0 1 6.4 4h11.2A2.4 2.4 0 0 1 20 6.4v7.8a2.4 2.4 0 0 1-2.4 2.4H10l-4.6 3.6v-3.6A2.4 2.4 0 0 1 4 14.2z"/>',
  send:'<path d="M12 19.5V5M5.6 11.2L12 4.8l6.4 6.4"/>',
  check:'<path d="M5 12.6l4.3 4.3L19.2 7"/>',
  tap:'<circle cx="12" cy="9" r="3"/><path d="M6.5 9a5.5 5.5 0 0 1 11 0"/><path d="M12 12v8"/>',
};
const icon=(n,s,c,sw=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" color="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const AV={Alex:'linear-gradient(160deg,#7aa2ff,#4f6bff)',Sam:'linear-gradient(160deg,#ffae4a,#ff6a00)'};
const chatHeader=n=>`<div class="abs" style="left:0;top:0;width:100%;height:190px;background:rgba(255,255,255,.92);border-bottom:2px solid #efeef4;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px">
  <div style="text-align:center"><div class="sq" style="width:76px;height:76px;margin:0 auto;border-radius:50%;background:${AV[n]};color:#fff;font-weight:900;font-size:36px">${n[0]}</div><div style="font-weight:700;font-size:24px;margin-top:8px">${n} ›</div></div></div>`;
const attach=(id='')=>`<div class="abs" ${id?`id="${id}"`:''} style="left:28px;right:28px;bottom:150px;height:520px;border-radius:40px;background:#f1f0f6;padding:22px">
  <div style="position:relative;width:300px;height:430px"></div>
  <div style="position:absolute;left:345px;top:30px;font-weight:700;font-size:26px">cat.jpg</div>
  <div style="position:absolute;left:345px;top:68px;font-weight:600;font-size:22px;color:#8b8a97">1 photo selected</div></div>`;
const inputBar=(id='')=>`<div class="abs" style="left:28px;bottom:40px;width:350px;height:92px;border-radius:46px;background:#f1f0f6;display:flex;align-items:center;padding-left:30px;color:#a5a4b0;font-weight:600;font-size:28px">Message</div>
  <div class="sendBtn" ${id?`id="${id}"`:''}>Send ${icon('send',30,'#fff',3)}</div>`;
const photoAt=(id,x,y,w,h,r,cross)=>`<div class="abs" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r};overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.3)"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover;display:block">${cross?`<div class="sq xx" style="position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:26px;font-weight:700">×</div>`:''}</div>`;
function phoneEl(parent,inner,cx,cy,s){const el=mk(parent,`<div class="phone" style="left:${cx-300}px;top:${cy-620}px" data-base="${s}"><div class="screen"><div class="island"></div>${inner}</div></div>`);T(el,{});return el}
function blkEl(parent,n,parcel){return mk(parent,`<div class="blk"><div class="n">${n}</div><div class="bits mono">1011 0110<br>0100 1101</div>${parcel?`<div class="parcel"><i></i><b>${n}</b></div>`:''}</div>`)}
function nodeEl(parent,x,y,r){return mk(parent,`<div class="card sq" style="left:${x-r}px;top:${y-r}px;width:${r*2}px;height:${r*2}px;border-radius:50%"><div class="dot" style="width:${r*.62}px;height:${r*.62}px;border-radius:50%;background:#8ea6ff"></div></div>`)}
function serversEl(parent,x,y,w,h){const g=mk(parent,`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;pointer-events:none"></div>`);
  mk(g,`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:50px;padding:34px">${[0,1,2].map(i=>`<div style="height:${(h-110)/3}px;margin-bottom:14px;border-radius:16px;background:rgba(255,255,255,.55);display:flex;align-items:center;gap:12px;padding:0 18px"><i class="led" style="width:14px;height:14px;border-radius:50%;background:#16c060"></i><i style="width:14px;height:14px;border-radius:50%;background:#2dd4bf"></i><i style="flex:1;height:9px;border-radius:5px;background:#d6d5e2"></i></div>`).join('')}</div>`);
  mk(g,`<div class="sq" style="position:absolute;left:${x+w-70}px;top:${y-30}px;width:100px;height:100px;border-radius:30px;background:linear-gradient(160deg,#ffae4a,#ff6a00);box-shadow:0 14px 28px -8px rgba(255,110,0,.6)">${icon('chat',54,'#fff',2.2)}</div>`);return g}
const fingerSVG=`<svg width="210" height="520" viewBox="0 0 210 520" style="display:block">
  <defs><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#e9a983"/><stop offset=".5" stop-color="#f7cdb2"/><stop offset="1" stop-color="#df9874"/></linearGradient>
  <linearGradient id="nl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3d8"/><stop offset="1" stop-color="#efbfae"/></linearGradient></defs>
  <path d="M40 520 L30 130 Q30 22 105 22 Q180 22 180 130 L176 520 Z" fill="url(#sk)"/><path d="M66 86 Q105 40 144 86 L140 168 Q105 182 70 168 Z" fill="url(#nl)" stroke="#d99a83" stroke-width="2"/>
  <path d="M70 270 Q105 282 140 270M74 300 Q105 310 136 300" stroke="#c9876a" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/></svg>`;
const SVGNS='http://www.w3.org/2000/svg';
function svgLayer(parent,inner){return mk(parent,`<svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920">${inner}</svg>`)}
function pathPt(p,u){const L=p.getTotalLength();const q=p.getPointAtLength(clamp(u)*L);return {x:q.x,y:q.y}}

// ───────────────────────── scene scaffolding
const root=$('root');
const PAL={
  s1a:['#ffc28c','#ff9fcf','#b8a3ff','#ffe39a'],s1b:['#ffc9a0','#c9b2ff','#a9c8ff','#ffd2e6'],s2:['#9ff0e2','#b9d4ff','#d6c4ff','#c7f5e9'],
  s3:['#a8c6ff','#9ff0e2','#d2c2ff','#bfe2ff'],s4:['#a6e4ff','#9ff0e2','#c9dcff','#bff0ea'],s5:['#ffd0a3','#9ff0e2','#ffc2dc','#d4c4ff'],s6:['#c9b2ff','#9ff0e2','#a9c8ff','#ffd2e6']};
const BLOBP=[[150,300],[920,760],[180,1500],[900,1680]];
function scene(){const el=mk(root,'<div class="scene"></div>');const bg=mk(el,'<div class="sbg"></div>');const blobs=BLOBP.map(()=>mk(bg,'<div class="blob"></div>'));const cm=mk(el,'<div class="cam"></div>');return {el,bg,blobs,cam:cm}}
function setPal(S,cols,t){S.blobs.forEach((b,i)=>{const c=cols[i];const x=BLOBP[i][0]+Math.sin(t*.21+i*1.7)*90,y=BLOBP[i][1]+Math.cos(t*.17+i)*110;
  b.style.background=`radial-gradient(circle,rgb(${c}) 0%,rgba(${c},0) 64%)`;b.style.transform=`translate(${x-700}px,${y-700}px)`})}
const palMix=(a,b,p)=>a.map((c,i)=>mixHex(c,b[i],p).join(','));
function show(S,o,blur=0){S.el.style.visibility=o<=.004?'hidden':'visible';S.el.style.opacity=o;S.el.style.filter=blur>.1?`blur(${blur}px)`:'none'}

// captions (screen space, one at a time)
const capLayer=mk(root,`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;z-index:20"></div>`);
const CAPS=[
 {t0:2.35,t1:4.25,y:200,size:132,html:['HOW DOES IT','GET <span style="color:#14b8a6">THERE?</span>']},
 {t0:6.9,t1:13.1,y:200,size:150,html:['DATA','<span style="color:#0fa3a0">PACKETS</span>']},
 {t0:16.0,t1:18.4,y:210,size:136,html:['WI-FI <span style="color:#b9b8c8">/</span> MOBILE']},
 {t0:19.3,t1:22.9,y:210,size:140,left:70,html:['<span style="color:#3d6bff">ROUTERS</span>']},
 {t0:23.2,t1:26.1,y:210,size:118,html:['APP <span style="color:#ff6a00">SERVERS</span>']},
 {t0:28.0,t1:31.5,y:200,size:140,color:'#0e3a50',html:['UNDERSEA','CABLE']},
 {t0:33.6,t1:36.35,y:520,size:150,color:'#fff',shadow:1,html:['PULSES','OF LIGHT']},
 {t0:38.3,t1:40.9,y:200,size:130,html:['REASSEMBLE']},
 {t0:41.3,t1:45.7,y:200,size:140,html:['PHOTO','<span style="color:#16c060">RECEIVED</span>']},
 {t0:47.3,t1:50.6,y:200,size:124,left:70,html:['ONE TAP.','A WHOLE','<span style="color:#14b8a6">NETWORK.</span>']},
];
CAPS.forEach(c=>{c.el=mk(capLayer,`<div class="cap" style="top:${c.y}px;font-size:${c.size}px;${c.left!=null?`left:${c.left}px;text-align:left`:'left:0;width:1080px'};${c.color?`color:${c.color};`:''}${c.shadow?'text-shadow:0 10px 40px rgba(0,60,90,.35);':''}">${c.html.map(h=>`<span class="ln">${h}</span>`).join('')}</div>`);c.lines=[...c.el.querySelectorAll('.ln')]});
function renderCaps(t){CAPS.forEach(c=>{
  if(t<c.t0-.05||t>c.t1+.45){c.el.style.visibility='hidden';return}c.el.style.visibility='visible';
  const out=E.in(prog(t,c.t1,c.t1+.4));
  c.lines.forEach((l,i)=>{const q=E.out(prog(t,c.t0+i*.09,c.t0+i*.09+.5));l.style.opacity=q*(1-out);l.style.filter=`blur(${((1-q)*16+out*14).toFixed(1)}px)`;l.style.transform=`translateY(${(1-q)*50-out*40}px)`});
})}

// ═════════ SCENE 1 — tap Send (world = mockup 1B layout; 1A is the camera at zoom 2 on the sender phone)
const S1=scene();
const s1svg=svgLayer(S1.cam,`<defs><mask id="m1"><path id="p1m" d="M440 1000 C 560 1060, 540 1300, 640 1400" stroke="#fff" stroke-width="30" fill="none" pathLength="1" stroke-dasharray="1 1"/></mask></defs>
  <path d="M440 1000 C 560 1060, 540 1300, 640 1400" stroke="#2dd4bf" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 18" mask="url(#m1)"/>`);
const p1m=$('p1m');
const P1=phoneEl(S1.cam,chatHeader('Alex')+attach('att1')+photoAt('ph1',50,556,300,430,'30px',1)+`<div class="abs" id="sending1" style="right:34px;top:962px;font-weight:600;font-size:22px;color:#8b8a97">Sending…</div>`+inputBar('send1'),260,960,.68);
const P2=phoneEl(S1.cam,chatHeader('Sam')+inputBar(),820,1440,.68);
const att1=$('att1'),ph1=$('ph1'),sending1=$('sending1'),send1=$('send1');
const FP=mk(S1.cam,`<div class="card" style="left:0;top:0;width:140px;height:196px;border-radius:28px;padding:8px"><img src="${CAT}" style="width:100%;height:100%;object-fit:cover;border-radius:22px;display:block"></div>`);
const FING=mk(S1.cam,`<div class="abs" style="left:0;top:0;width:210px;height:520px;transform-origin:105px 30px;filter:drop-shadow(0 30px 30px rgba(60,30,40,.35))">${fingerSVG}</div>`);
// send button centre in world: phone-local (469,1136) relative to phone centre (300,620) * 0.68
const SENDW={x:260+(469-300)*.68,y:960+(1136-620)*.68};
const BUBW={x:260+(404-300)*.68,y:960+(753-620)*.68};
function renderS1(t){
  // τ: times ≥54 are the loop lead-in (negative τ)
  const τ=t>=54?t-55:t;
  if(τ>5.02){show(S1,0);return}
  show(S1,1);
  setPal(S1,palMix(PAL.s1a,PAL.s1b,E.io(prog(τ,1.2,2.6))),t);
  // camera: 1A (zoom 2 on sender) → 1B (identity) → push into the travelling photo
  let c=kf(τ,[[-1,{x:260,y:960,z:2,sx:540,sy:930}],[1.2,{x:260,y:960,z:2,sx:540,sy:930}],[2.55,{x:540,y:960,z:1,sx:540,sy:960},'io'],[4.15,{x:540,y:968,z:1.04,sx:540,sy:960},'lin'],[5.0,{x:540,y:1198,z:4.43,sx:540,sy:960},'inExpo']]);
  cam(S1.cam,c);
  // finger
  const press=τ>=.18&&τ<.6?(τ<.3?E.out(prog(τ,.18,.3)):1-E.out(prog(τ,.3,.6))):0;
  const f=kf(τ,[[-.85,{dy:520,o:0}],[-.2,{dy:0,o:1},'out'],[.85,{dy:0,o:1}],[1.5,{dy:380,o:0},'in']]);
  FING.style.transform=`translate(${SENDW.x+6-105}px,${SENDW.y-30+f.dy+press*6}px) scale(${.725*(1-press*.04)})`;vis(FING,f.o,0);
