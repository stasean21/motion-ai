<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта-история — макеты</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f1f2f6}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#111218}
.abs{position:absolute}
.mono{font-family:'DejaVu Sans Mono',monospace}
.ctr{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:rgba(255,255,255,.94);border:1.5px solid #fff;box-shadow:0 12px 26px -14px rgba(40,50,110,.3);transform:translate(-50%,-50%)}
.card{position:absolute;border-radius:46px;background:#fff;box-shadow:0 46px 90px -40px rgba(40,50,110,.4),0 10px 24px -12px rgba(40,50,110,.14);overflow:hidden}
.chip{display:inline-flex;white-space:nowrap;align-items:center;gap:12px;padding:10px 24px;border-radius:999px;background:#fff;font-weight:800;letter-spacing:.04em;box-shadow:0 12px 24px -12px rgba(40,50,110,.35)}
.dot{width:16px;height:16px;border-radius:50%}
.blue{color:#2f7bf5}
.sub{position:absolute;left:540px;transform:translate(-50%,-50%);padding:16px 34px;border-radius:999px;background:rgba(255,255,255,.95);font-weight:700;font-size:37px;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 14px 30px -16px rgba(40,50,110,.35)}
#word{position:absolute;left:0;top:0;white-space:pre;font-weight:700;line-height:1;letter-spacing:-.01em;font-size:77px}
#word .r{color:#C43D3D}
svg{display:block}
</style>
</head>
<body>
<div id="root" class="abs" style="inset:0"></div>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/world50m.js"></script>
<script>
const V=(location.hash||'#A').slice(1);
const ROOT=document.getElementById('root');
const BLUE='#2f7bf5',ORANGE='#f29a3d',INK='#111218',LAND='#ffffff',SEA='#e7edf8',EDGE='#d3dae8';
const countries=topojson.feature(WORLD,WORLD.objects.countries).features.filter(c=>c.id!=='010');
const byId=id=>countries.find(c=>c.id===id);
const BR='076',PT='620',ES='724';
const MIDEAST=new Set(['682','887','512','784','634','414','368','400','376','760','422','364','792','275','048','196']);
const TORD=-46.5,POPE=-38;   // 1494 treaty line, 1493 papal line (degrees west)
const html=(s)=>{const d=document.createElement('div');d.innerHTML=s.trim();const e=d.firstChild;ROOT.appendChild(e);return e};

function counter(n){const sl=[0,1,2,3,4,5].map(k=>`<span style="font-style:italic;color:${k<n?BLUE:'#c6cbdb'}">/</span>`).join('');
  html(`<div class="pill" style="left:540px;top:150px;height:70px;padding:0 30px;gap:20px;font-weight:800;font-size:31px;letter-spacing:.04em"><span>ГЛАВА ${n} ИЗ 6</span><span class="mono" style="font-size:37px;letter-spacing:-.04em;font-weight:700">${sl}</span></div>`)}

// map svg of size w×h fitted to a lon/lat box
function mapSVG(w,h,box){
  const proj=d3.geoMercator().fitExtent([[0,0],[w,h]],{type:'MultiPoint',coordinates:[[box[0],box[1]],[box[2],box[3]]]});
  const path=d3.geoPath(proj);const lx=lon=>proj([lon,0])[0];
  const grat=d3.geoGraticule().step([15,15])();
  return {proj,path,lx,grat,w,h};
}
const land=(m,f,fill,extra='')=>`<path d="${m.path(f)}" fill="${fill}" stroke="${EDGE}" stroke-width="1" stroke-linejoin="round" ${extra}/>`;
function baseLayer(m){return `<rect width="${m.w}" height="${m.h}" fill="${SEA}"/>
  <path d="${m.path(m.grat)}" fill="none" stroke="#dbe3f2" stroke-width="1.5"/>
  ${countries.map(c=>land(m,c,LAND)).join('')}`}
function centroid(c){return d3.geoCentroid(c)}

// ───────────────────────── A: map inside the house card, the split shown by colour
if(V==='A'){
  counter(3);
  html(`<div class="ctr" style="left:540px;top:300px;font-weight:900;font-size:66px;letter-spacing:-.04em;line-height:1">Мир делят <span class="blue">одной линией</span></div>`);
  const W=960,H=1080,m=mapSVG(W,H,[-108,-42,42,70]);const X=m.lx(TORD);
  const west=countries.filter(c=>centroid(c)[0]<-25);
  const east=countries.filter(c=>{const [lo,la]=centroid(c);return lo>-20&&lo<52&&la<37&&!MIDEAST.has(c.id)});
  const svg=`<svg width="${W}" height="${H}">
   <defs><clipPath id="cw"><rect x="0" y="0" width="${X}" height="${H}"/></clipPath><clipPath id="ce"><rect x="${X}" y="0" width="${W-X}" height="${H}"/></clipPath></defs>
   ${baseLayer(m)}
   <g clip-path="url(#cw)">${west.map(c=>land(m,c,ORANGE,'opacity=".9"')).join('')}</g>
   <g clip-path="url(#ce)">${east.map(c=>land(m,c,BLUE,'opacity=".88"')).join('')}${land(m,byId(BR),BLUE,'opacity=".88"')}</g>
   ${land(m,byId(ES),ORANGE)}${land(m,byId(PT),BLUE)}
   <line x1="${X}" y1="0" x2="${X}" y2="${H}" stroke="${INK}" stroke-width="5"/>
  </svg>`;
  html(`<div class="card" style="left:60px;top:420px;width:${W}px;height:${H}px">${svg}</div>`);
  const cx=60+X;
  html(`<div class="pill" style="left:${cx}px;top:470px;height:62px;padding:0 24px;font-weight:800;font-size:29px;letter-spacing:.05em;background:${INK};color:#fff;border-color:${INK}">ЛИНИЯ 1494</div>`);
  html(`<div class="chip" style="position:absolute;left:${cx-36}px;top:1020px;transform:translate(-100%,-50%);font-size:31px"><span class="dot" style="background:${ORANGE}"></span>ИСПАНИЯ</div>`);
  html(`<div class="chip" style="position:absolute;left:${cx+36}px;top:1020px;transform:translateY(-50%);font-size:31px"><span class="dot" style="background:${BLUE}"></span>ПОРТУГАЛИЯ</div>`);
  html(`<div class="sub" style="top:1640px">Запад — Испании, восток — Португалии</div>`);
}

// ───────────────────────── B: the speed-reading layout — map on top, narration as one word, year row below
if(V==='B'){
  counter(4);
  const W=960,H=820,m=mapSVG(W,H,[-62,4,6,52]);const X=m.lx(TORD),X0=m.lx(POPE);
  const ptc=m.proj([-8.2,39.6]);
  const svg=`<svg width="${W}" height="${H}">
   <defs><marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="${BLUE}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
   ${baseLayer(m)}
   ${land(m,byId(ES),ORANGE)}${land(m,byId(PT),BLUE)}
   <line x1="${X0}" y1="0" x2="${X0}" y2="${H}" stroke="#9aa3b8" stroke-width="4" stroke-dasharray="14 14"/>
   <line x1="${X}" y1="0" x2="${X}" y2="${H}" stroke="${INK}" stroke-width="5"/>
   <path d="M${ptc[0]-14} ${ptc[1]} C ${ptc[0]-180} ${ptc[1]+120}, ${X+220} ${H*0.52}, ${X+26} ${H*0.52}" fill="none" stroke="${BLUE}" stroke-width="5" stroke-linecap="round"/>
   <line x1="${X0-14}" y1="${H*0.70}" x2="${X+18}" y2="${H*0.70}" stroke="${BLUE}" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/>
   <circle cx="${X}" cy="${H*0.52}" r="22" fill="#fff" stroke="${BLUE}" stroke-width="6"/>
  </svg>`;
  html(`<div class="card" style="left:60px;top:250px;width:${W}px;height:${H}px">${svg}</div>`);
  html(`<div class="pill" style="left:${60+X0}px;top:300px;height:54px;padding:0 20px;font-weight:800;font-size:26px;letter-spacing:.05em;color:#8a90a6">1493</div>`);
  html(`<div class="pill" style="left:${60+X}px;top:300px;height:54px;padding:0 20px;font-weight:800;font-size:26px;letter-spacing:.05em;background:${INK};color:#fff;border-color:${INK}">1494</div>`);
  html(`<div class="chip" style="position:absolute;left:${60+(X0+X)/2}px;top:${250+H*0.70+46}px;transform:translate(-50%,-50%);font-size:27px;color:${BLUE}">НА 370 ЛИГ ЗАПАДНЕЕ</div>`);
  html(`<div class="chip" style="position:absolute;left:${60+ptc[0]+8}px;top:${250+ptc[1]+64}px;transform:translate(-50%,0);font-size:27px"><span class="dot" style="background:${BLUE}"></span>ПОРТУГАЛИЯ</div>`);
  // reading card with RSVP word (same geometry as the speed-reading video, axis x=400)
  html(`<div class="card" style="left:60px;top:1130px;width:960px;height:300px"></div>`);
  html(`<div class="abs" style="left:110px;top:1185px;width:860px;height:2px;background:#e3e6ee"></div>`);
  html(`<div class="abs" style="left:110px;top:1375px;width:860px;height:2px;background:#e3e6ee"></div>`);
  html(`<div class="abs" style="left:398px;top:1171px;width:4px;height:30px;border-radius:2px;background:${BLUE};opacity:.55"></div>`);
  html(`<div class="abs" style="left:398px;top:1361px;width:4px;height:30px;border-radius:2px;background:${BLUE};opacity:.55"></div>`);
  const W2=html(`<div id="word">пе<span class="r">р</span>едвинуть</div>`);
  const WD=document.getElementById('word');WD.innerHTML='пер<span class="r">е</span>двинуть';
  // centre the red letter on x=400, baseline 1305
  WD.innerHTML+='<span id="bl" style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
  const wb=WD.getBoundingClientRect(),rb=WD.querySelector('.r').getBoundingClientRect(),bl=document.getElementById('bl').getBoundingClientRect();
  WD.style.transform=`translate(${400-(rb.left-wb.left+rb.width/2)}px,${1305-(bl.top-wb.top)}px)`;
  // year row — the speed row mechanic reused as a timeline
  const YRS=[1488,1492,1494,1500],CUR=2,SW=170,SG=18,SX=540-(4*SW+3*SG)/2;
  YRS.forEach((y,k)=>{const on=k===CUR;
    if(on)html(`<div class="abs" style="left:${SX+k*(SW+SG)}px;top:1500px;width:${SW}px;height:76px;border-radius:999px;background:${BLUE};box-shadow:0 14px 26px -12px rgba(47,123,245,.6)"></div>`);
    html(`<div class="abs" style="left:${SX+k*(SW+SG)}px;top:1500px;width:${SW}px;height:76px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:47px;color:${on?'#fff':'rgb(154,160,180)'};${on?'':'filter:blur(3.2px);opacity:.45;transform:scale(.92)'}">${y}</div>`)});
  html(`<div class="ctr" style="left:540px;top:1616px;font-weight:700;font-size:29px;letter-spacing:.08em;color:#8a90a6">ТОРДЕСИЛЬЯССКИЙ ДОГОВОР</div>`);
}

// ───────────────────────── C: the camera tilts over the map, upright cards float above it
if(V==='C'){
  counter(5);
  const W=1800,H=1700,m=mapSVG(W,H,[-100,-58,-16,16]);const X=m.lx(TORD);
  const sa=countries.filter(c=>{const [lo,la]=centroid(c);return lo<-33&&lo>-90&&la<13&&c.id!==BR});
  const svg=`<svg width="${W}" height="${H}">
   <defs><clipPath id="ce"><rect x="${X}" y="0" width="${W-X}" height="${H}"/></clipPath>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#cfe0fd"/><rect width="7" height="18" fill="#9fc0fa"/></pattern></defs>
   ${baseLayer(m)}
   ${sa.map(c=>land(m,c,ORANGE,'opacity=".9"')).join('')}
   ${land(m,byId(BR),'url(#hatch)')}
   <g clip-path="url(#ce)">${land(m,byId(BR),BLUE)}</g>
   <line x1="${X}" y1="0" x2="${X}" y2="${H}" stroke="${INK}" stroke-width="6"/>
  </svg>`;
  // ground plane: low camera, map tilted away; the edges dissolve into the flat background
  html(`<div class="abs" style="left:${540-W/2}px;top:330px;width:${W}px;height:${H}px;transform:perspective(1500px) rotateX(34deg);transform-origin:50% 40%;-webkit-mask-image:linear-gradient(to bottom,transparent 4%,#000 22%)">${svg}</div>`);
  // upright stat card
  html(`<div class="card" style="left:150px;top:250px;width:780px;height:250px;overflow:visible"></div>`);
  html(`<div class="ctr" style="left:540px;top:318px;font-weight:700;font-size:31px;letter-spacing:.06em;color:#8a90a6">БРАЗИЛИЯ СЕГОДНЯ</div>`);
  html(`<div class="ctr" style="left:540px;top:405px;font-weight:900;font-size:92px;letter-spacing:-.045em">8,5 <span class="blue">млн км²</span></div>`);
  html(`<div class="chip" style="position:absolute;left:540px;top:500px;transform:translate(-50%,-50%);font-size:29px;background:${BLUE};color:#fff">5-Я В МИРЕ</div>`);
  // legend chips
  html(`<div class="chip" style="position:absolute;left:84px;top:1560px;font-size:28px"><span class="dot" style="background:${BLUE}"></span>ПО ДОГОВОРУ</div>`);
  html(`<div class="chip" style="position:absolute;left:996px;top:1560px;transform:translateX(-100%);font-size:28px"><span class="dot" style="background:repeating-linear-gradient(45deg,#9fc0fa 0 4px,#cfe0fd 4px 9px)"></span>ЗАНЯЛИ ПОЗЖЕ</div>`);
  html(`<div class="sub" style="top:1720px">…далеко за прежнюю линию</div>`);
}
document.fonts.ready.then(()=>{window.ready=true});
</script>
</body>
</html>
