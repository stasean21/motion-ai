<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Map story — full bleed</title>
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url(fonts/cormorant-garamond-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url(fonts/cormorant-garamond-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f1f2f6}
body{font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#111218}
.abs{position:absolute}
.mono{font-family:'DejaVu Sans Mono',monospace}
.ctr{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.pill{position:absolute;border-radius:999px;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:rgba(255,255,255,.95);border:1.5px solid #fff;box-shadow:0 14px 30px -14px rgba(10,20,40,.45);transform:translate(-50%,-50%)}
.card{position:absolute;border-radius:40px;background:#fff;box-shadow:0 40px 80px -36px rgba(10,20,40,.6),0 10px 24px -12px rgba(10,20,40,.25)}
.chip{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;padding:10px 24px;border-radius:999px;background:#fff;font-weight:800;letter-spacing:.04em;box-shadow:0 14px 28px -12px rgba(10,20,40,.5)}
.blue{color:#2f7bf5}
.sub{position:absolute;left:540px;transform:translate(-50%,-50%);padding:16px 34px;border-radius:999px;background:rgba(255,255,255,.96);font-weight:700;font-size:37px;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 16px 34px -16px rgba(10,20,40,.55)}
.subw{position:absolute;left:540px;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;font-size:58px;letter-spacing:-.01em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 4px 18px rgba(0,0,0,.55)}
.plate{position:absolute;left:0;top:0;width:1080px;height:1920px}
svg{display:block}
</style>
</head>
<body>
<div id="root" class="abs" style="inset:0"></div>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/world50m.js"></script>
<script src="plates/plates.js"></script>
<script src="icons.js"></script>
<script src="characters2.js"></script>
<script>
const V=(location.hash||'#F1').slice(1);
const ROOT=document.getElementById('root');
const BLUE='#2f7bf5',ORANGE='#f08a24',INK='#2a2118';
const countries=topojson.feature(WORLD,WORLD.objects.countries).features.filter(c=>c.id!=='010');
const byId=id=>countries.find(c=>c.id===id);
const MIDEAST=new Set(['682','887','512','784','634','414','368','400','376','760','422','364','792','275','048','196']);
const html=s=>{const d=document.createElement('div');d.innerHTML=s.trim();const e=d.firstChild;ROOT.appendChild(e);return e};
const proj=name=>{const P=PLATES[name];return d3.geoMercator().scale(P.k).translate([P.tx,P.ty])};
function counter(n){const sl=[0,1,2,3,4,5].map(k=>`<span style="font-style:italic;color:${k<n?BLUE:'#c6cbdb'}">/</span>`).join('');
  html(`<div class="pill" style="left:540px;top:150px;height:70px;padding:0 30px;gap:20px;font-weight:800;font-size:31px;letter-spacing:.04em"><span>CHAPTER ${n} OF 6</span><span class="mono" style="font-size:37px;letter-spacing:-.04em;font-weight:700">${sl}</span></div>`)}
const at=(x,y,inner,extra='')=>html(`<div class="abs" style="left:${x}px;top:${y}px;${extra}">${inner}</div>`);
// smooth curve through projected points (Catmull-Rom → cubic Bézier)
function smooth(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}




// ───────────── full-bleed map; all UI sits on top: progress pill (n/6 + slashes + era), phrase capsule, chips + subtitle raised
function topUI(n,era,phrase,opt={}){
  // year pill: the year only; on a change the old year rolls up and the new one rolls in
  const yr=opt.from?`<span style="position:relative;display:inline-block;height:44px;overflow:hidden;vertical-align:middle"><span style="display:block;transform:translateY(${-44*opt.roll}px)"><span style="display:block;height:44px;line-height:44px;filter:blur(${opt.roll*6}px);opacity:${1-opt.roll}">${opt.from}</span><span style="display:block;height:44px;line-height:44px;filter:blur(${(1-opt.roll)*6}px);opacity:${opt.roll}">${era}</span></span></span>`:era;
  html(`<div class="pill" style="left:540px;top:140px;height:70px;padding:0 34px;font-weight:900;font-size:38px;letter-spacing:.02em;color:${BLUE}">${yr}</div>`);
  // phrase capsule: words come out of the blur one by one (opt.words = how many are in, fractional)
  const ws=phrase.split(' ');const k=opt.words??ws.length;
  const inner=ws.map((w,i)=>{if(w==='|')return '<br>';const p=Math.max(0,Math.min(1,k-i));return `<span style="display:inline-block;margin:0 .12em;opacity:${p};filter:blur(${(1-p)*10}px);transform:translateY(${(1-p)*14}px)">${w.replace(/_/g,' ')}</span>`}).join(' ');
  if(opt.noPhrase)return;
  html(`<div class="abs" style="left:540px;top:215px;transform:translateX(-50%);padding:22px 44px 26px;border-radius:40px;background:rgba(255,255,255,.96);box-shadow:0 22px 46px -22px rgba(10,20,40,.55);font-weight:900;font-size:66px;letter-spacing:-.04em;line-height:1.02;text-align:center;white-space:nowrap">${inner}</div>`);
}
const SUBY=1560,CHIPY=1440;
function subp(t,o={}){const y=SUBY+(o.dy||0);const ws=t.split(' '),k=o.words??ws.length,cur=Math.floor(k);
  // karaoke: spoken words dark, the word being said blue, the rest waits at 30 %
  return html(`<div class="sub" style="top:${y}px">${ws.map((w,i)=>`<span style="display:inline-block;margin:0 .08em;${i<cur||!o.hl?'':i===cur?`color:${BLUE}`:'opacity:.3'}">${w}</span>`).join(' ')}</div>`)}
function chipRow(items){return html(`<div class="abs" style="left:540px;top:${CHIPY}px;transform:translate(-50%,-50%);display:flex;gap:16px">${items.map(([t,st])=>`<span class="chip" style="font-size:29px;${st||''}">${t}</span>`).join('')}</div>`)}
const ROUTE=[[-9.1,38.7],[-16,29],[-22,14],[-27,0],[-24,-18],[-8,-33],[10,-37.5],[20,-36.6],[31,-30],[39,-19],[41,-6],[52,4],[66,10],[75.8,11.25]];
const ANGER=s=>`<svg width="${110*s}" height="${110*s}" viewBox="-45 -45 90 90">${[0,90,180,270].map(r=>`<path transform="rotate(${r})" d="M8 -30 Q8 -10 28 -8" stroke="#d62828" stroke-width="8" fill="none" stroke-linecap="round"/>`).join('')}</svg>`;

if(V==='F1'){
  at(0,0,'<img class="plate" src="plates/intro_sat.png">');
  const pr=proj('intro'),path=d3.geoPath(pr);
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter></defs>
   <path d="${path(byId('076'))}" fill="none" stroke="#7fb2ff" stroke-width="18" opacity=".55" filter="url(#gl)"/><path d="${path(byId('076'))}" fill="${BLUE}" fill-opacity=".34" stroke="#fff" stroke-width="4"/></svg>`);
  const c=pr([-51,-10]);at(c[0]-80,c[1]-80,ICON.pulse(BLUE,.35));
  topUI(1,'TODAY','Why does <span_class="blue">Brazil</span> | speak Portuguese?');
  chipRow([['#1 IN SOUTH AMERICA',`background:${BLUE};color:#fff`],['#5 IN THE WORLD',`color:${BLUE}`]]);
  subp('the biggest country in South America');
}
if(V==='F2'){
  at(0,0,'<img class="plate" src="plates/voyage_hist.png">');
  const pr=proj('voyage'),route=ROUTE.map(p=>pr(p)),k=7;
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="${smooth(route.slice(k))}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round" opacity=".8"/>
   <path d="${smooth(route.slice(0,k+1))}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="${smooth(route.slice(0,k+1))}" fill="none" stroke="${BLUE}" stroke-width="6" stroke-dasharray="18 12" stroke-linecap="round"/></svg>`);
  at(0,0,'<img class="plate" src="plates/voyage_fog.png" style="-webkit-mask-image:radial-gradient(ellipse 560px 760px at 520px 1000px,transparent 55%,#000 95%)">');
  const sp=route[k];at(sp[0]-300,sp[1]-34,ICON.wake(250));at(sp[0]-110,sp[1]-176,ICON.caravel(.95));
  const L=route[0];html(`<div class="chip" style="position:absolute;left:${L[0]+24}px;top:${L[1]-26}px;font-size:26px;padding:8px 20px 8px 10px">${ICON.flagPT(.42)} LISBON</div>`);
  const T=route[route.length-1];at(T[0]-80,T[1]-80,ICON.pulse(BLUE,.6));html(`<div class="chip" style="position:absolute;left:${T[0]}px;top:${T[1]+50}px;transform:translateX(-80%);font-size:26px;color:${BLUE}">INDIA</div>`);
  topUI(2,'1497','Portugal sails | <span_class="blue">around</span> <span_class="blue">Africa</span>');
  subp('looking for a sea route to India');
}
if(V==='F3'){
  at(0,0,'<img class="plate" src="plates/treaty_hist.png">');
  const pr=proj('treaty'),path=d3.geoPath(pr),X=pr([-38,0])[0],cen=c=>d3.geoCentroid(c);
  const west=countries.filter(c=>cen(c)[0]<-25),east=countries.filter(c=>{const [lo,la]=cen(c);return lo>-20&&lo<52&&la<37&&!MIDEAST.has(c.id)});
  html(`<svg class="abs" style="left:0;top:0;mix-blend-mode:multiply" width="1080" height="1920"><defs><clipPath id="cw"><rect width="${X}" height="1920"/></clipPath><clipPath id="ce"><rect x="${X}" width="${1080-X}" height="1920"/></clipPath></defs>
   <g clip-path="url(#cw)" fill="${ORANGE}" opacity=".62">${west.map(c=>`<path d="${path(c)}"/>`).join('')}</g>
   <g clip-path="url(#ce)" fill="${BLUE}" opacity=".72">${east.map(c=>`<path d="${path(c)}"/>`).join('')}<path d="${path(byId('076'))}"/></g>
   <path d="${path(byId('724'))}" fill="${ORANGE}"/><path d="${path(byId('620'))}" fill="${BLUE}"/></svg>`);
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M${X} 0 V1920" stroke="#fff" stroke-width="14" opacity=".55"/><path d="M${X} 0 V1920" stroke="${INK}" stroke-width="8"/></svg>`);
  at(X-330,900,CAST2.isabella(.85));at(X-200,930,CAST2.ferdinand(.85));
  at(X-110,1060,CAST2.pope(.9));
  at(X+120,900,CAST2.joao(.88));
  topUI(3,'1493','The Pope splits | the world <span_class="blue">in_two</span>');
  chipRow([[`${ICON.flagES(.42)} SPAIN · WEST`,'padding:8px 22px 8px 10px'],[`${ICON.flagPT(.42)} PORTUGAL · EAST`,'padding:8px 22px 8px 10px']]);
  subp('everything west for Spain, east for Portugal');
}
if(V==='F4'){
  at(0,0,'<img class="plate" src="plates/iberia_hist.png">');
  const pr=proj('iberia'),path=d3.geoPath(pr);
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><g style="mix-blend-mode:multiply"><path d="${path(byId('724'))}" fill="#e3822b" opacity=".85"/><path d="${path(byId('620'))}" fill="#2f4fd1" opacity=".95"/></g>
   <path d="${path(byId('620'))}" fill="none" stroke="#1a1f3a" stroke-width="3" opacity=".7"/><path d="${path(byId('724'))}" fill="none" stroke="#3a2412" stroke-width="2.5" opacity=".55"/></svg>`);
  const EX=300,EY=430;at(EX,EY,PROP.easel('plates/treaty_hist.png',-20,-250,.85,540));
  const L0=306*.5-10+(306-147)*0,LX0=(pr?0:0)+ (789+595*(-38*Math.PI/180))*.5-10,LX1=(789+595*(-46.5*Math.PI/180))*.5-10;
  html(`<svg class="abs" style="left:${EX+25.5}px;top:${EY+17}px;overflow:visible" width="425" height="315"><path d="M${LX0} 0 V315" stroke="#fff" stroke-width="4" stroke-dasharray="10 9"/>
   <path d="M${LX1} 0 V315" stroke="#c4342d" stroke-width="6" stroke-dasharray="16 9"/><path d="M${LX0-6} 160 H${LX1+14}" stroke="#c4342d" stroke-width="5" stroke-linecap="round"/><path d="M${LX1+26} 148 L${LX1+12} 160 L${LX1+26} 172" stroke="#c4342d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  at(560,960,CAST2.ferdinand(1.05));at(735,1000,CAST2.isabella(1.0));
  at(120,980,CAST2.joao(1.1));at(120+225,950,ANGER(1));
  topUI(4,'1494','Portugal wants | a <span_class="blue">better_deal</span>');
  chipRow([['370 LEAGUES WEST',`color:${BLUE}`],['TREATY OF TORDESILLAS','']]);
  subp('and demands to move the line');
}
if(V==='F5'){
  at(0,0,'<img class="plate" src="plates/intro_sat.png">');
  const pr=proj('intro'),path=d3.geoPath(pr);
  const sa=countries.filter(c=>{const [lo,la]=d3.geoCentroid(c);return lo<-33&&lo>-90&&la<13&&la>-60&&c.id!=='076'});
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920">${sa.map(c=>`<path d="${path(c)}" fill="${ORANGE}" fill-opacity=".42" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>`).join('')}<path d="${path(byId('076'))}" fill="${BLUE}" fill-opacity=".42" stroke="#fff" stroke-width="4"/></svg>`);
  const b=pr([-50,-12]),a=pr([-66,-33]);
  html(`<div class="chip" style="position:absolute;left:${b[0]}px;top:${b[1]}px;transform:translate(-50%,-50%);font-size:34px;background:${BLUE};color:#fff">PORTUGUESE</div>`);
  html(`<div class="chip" style="position:absolute;left:${a[0]}px;top:${a[1]}px;transform:translate(-50%,-50%);font-size:34px;background:${ORANGE};color:#fff">SPANISH</div>`);
  topUI(6,'TODAY','One line — | <span_class="blue">two_languages</span>');
  subp('that’s why Brazil speaks Portuguese');
}

if(V.startsWith('SB')){const st=+V.slice(2);
  at(0,0,'<img class="plate" src="plates/iberia_hist.png">');
  const pr=proj('iberia'),path=d3.geoPath(pr);
  html(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><g style="mix-blend-mode:multiply"><path d="${path(byId('724'))}" fill="#e3822b" opacity=".85"/><path d="${path(byId('620'))}" fill="#2f4fd1" opacity=".95"/></g></svg>`);
  at(560,960,CAST2.ferdinand(1.05));at(735,1000,CAST2.isabella(1.0));at(120,980,CAST2.joao(1.1));
  const A='The Pope splits | the world <span_class="blue">in_two</span>',B='Portugal wants | a <span_class="blue">better_deal</span>';
  if(st===1){topUI(0,'1493',A);subp('everything west for Spain,',{words:3.4,hl:1});}
  if(st===2){topUI(0,'1493',A);subp('east for Portugal',{words:3});}
  if(st===3){topUI(0,'1494',B,{from:'1493',roll:.5,words:1.5});subp('Portugal wasn’t happy',{words:2.3,hl:1});}
  if(st===4){topUI(0,'1494',B,{words:9});subp('and demands to move the line',{words:4.5,hl:1});}
}
document.fonts.load('700 30px "Cormorant Garamond"').then(()=>Promise.all([...document.images].map(i=>i.decode()))).then(()=>{window.ready=true});
</script>
</body>
</html>
