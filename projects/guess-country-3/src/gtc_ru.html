<body>
<div id="map" class="abs" style="inset:0;overflow:hidden"></div>

 <canvas id="glc" width="1080" height="1920" class="abs" style="left:0;top:0"></canvas>

<script>
const FPS=60,BLUE='#2f7bf5';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const mk=(parent,h)=>{const d=document.createElement('div');d.innerHTML=h.trim();const e=d.firstChild;$(parent).appendChild(e);return e};
const vis=(el,o)=>{el.style.opacity=o;el.style.visibility=o<=.003?'hidden':'visible'};

// ───────── edit plan, built from the brief's segments; a slow 2 s globe hop sits between every pair of countries
// (5 s thinking windows and the reveal lengths are untouched; the hops only add running time)
const HOP=2.0;
const PLAN=[['canada','КАНАДА',1,{pre:'hook',dur:3}],['usa','США',1],['france','ФРАНЦИЯ',2],['spain','ИСПАНИЯ',1,{pre:'warm',dur:2}],['sweden','ШВЕЦИЯ',1],
  ['indonesia','ИНДОНЕЗИЯ',2],['azerbaijan','АЗЕРБАЙДЖАН',2,{pre:'hard',dur:1}],['peru','ПЕРУ',1,{post:'result',dur:3}],['bulgaria',null,0,{pre:'final',dur:2,post:'cta',dur2:6}]];
const SCHED={think:[],reveal:[],hops:[],maps:[]};{let t=0;
  PLAN.forEach(([k,name,rd,x={}],i)=>{if(i>0){SCHED.hops.push({t0:t,t1:t+HOP,from:PLAN[i-1][0],to:k});t+=HOP}
    SCHED.maps.push([k,t]);if(x.pre){SCHED[x.pre]=[t,t+x.dur];t+=x.dur}
    SCHED.think.push([t,k]);t+=5;if(name){SCHED.reveal.push([t,rd,name]);t+=rd}
    if(x.post==='result'){SCHED.result=[t,t+x.dur];t+=x.dur}if(x.post==='cta'){SCHED.cta=[t,t+x.dur2];t+=x.dur2}});
  SCHED.dur=t;SCHED.maps.forEach((m,i)=>m.push(i<SCHED.maps.length-1?SCHED.maps[i+1][1]:t))}
const DUR=SCHED.dur,NFR=Math.round(DUR*FPS);
const MAPS=SCHED.maps,THINK=SCHED.think,REVEAL=SCHED.reveal,WS=SCHED.warm[0],HS=SCHED.hard[0],RS=SCHED.result[0],FSq=SCHED.final[0],CS=SCHED.cta[0];
const COUNT=MAPS.map(([k,a],i)=>[a,i+1]);
const LEVELS=[[0,'УРОВЕНЬ 1 · ЛЕГКО'],[WS+1,'УРОВЕНЬ 2 · СРЕДНЕ'],[HS,'УРОВЕНЬ 3 · СЛОЖНО'],[FSq,'УРОВЕНЬ 4 · ФИНАЛ']];
const VO=[[.15,2.85,'Девять стран. Пять секунд. Готов?'],[WS+.05,WS+1.9,'Дальше\u00a0— сложнее.'],[HS+.05,HS+.85,'Уровень три.'],
  [RS+.15,RS+2.5,'Восемь позади. Осталась одна.'],[FSq+.1,FSq+1.85,'А эту страну назовёшь?'],[CS+.15,CS+5.5,'Какой твой ответ? Пиши страну в комментариях.']];
SCHED.vo=VO.map(v=>[v[0],v[1]]).concat(REVEAL.map(([a,d])=>[a+.05,a+(d>1?1.55:.85)]));

// ───────── map scenes: satellite (NASA Blue Marble) + borders without names + Brazil-style highlight
const CTRY=topojson.feature(WORLD10,WORLD10.objects.countries).features.filter(c=>c.id!=='010');
const MAPEL={};
function buildMap(k){const v=VIEWS[k],R=SAT[k],kk=1080/(v.w*Math.PI/180);
  const pr=d3.geoMercator().rotate([-v.cx,0]).scale(kk).translate([0,0]);const c=pr([v.cx,v.cy]);pr.translate([540-c[0],(v.sy||855)-c[1]]);const path=d3.geoPath(pr);   // rotated: the antimeridian cut stays far off-frame

  const box=d3.geoBounds(f),near=CTRY.filter(c=>{const b=d3.geoBounds(c);return b[1][0]>v.cx-v.w&&b[0][0]<v.cx+v.w&&b[1][1]>v.cy-v.w*1.2&&b[0][1]<v.cy+v.w*1.2});
  const el=mk('map',`<div class="abs" style="inset:0;visibility:hidden">
   <img src="sat/${k}.jpg" class="abs" style="left:0;top:0;transform-origin:0 0;transform:translate(${ix}px,${iy}px) scale(${sc});filter:brightness(1.08) saturate(1.08)">
   <svg class="abs" style="left:0;top:0" width="1080" height="1920">
    <g fill="none" stroke="#fff" stroke-width="1.6" stroke-opacity=".55" stroke-linejoin="round">${near.filter(c=>c.id!==v.id).map(c=>`<path d="${path(c)}"/>`).join('')}</g>
    <path d="${d}" fill="${BLUE}" fill-opacity=".34"/>
    <path d="${d}" fill="none" stroke="#7fb2ff" stroke-width="16" stroke-opacity=".45" stroke-linejoin="round" style="filter:blur(6px)"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
   </svg></div>`);
  MAPEL[k]=el}
// flat maps are no longer used: the whole video lives on one globe

// ───────── UI
const TITLE=mk('ui',`<div class="pill" style="left:540px;top:230px;height:104px;padding:0 50px;border-radius:36px;font-weight:900;font-size:64px;letter-spacing:-.03em">УГАДАЙ <span style="color:${BLUE};margin-left:.28em">СТРАНУ</span><span style="margin-left:22px;padding:6px 14px;border-radius:14px;background:${BLUE};color:#fff;font-size:26px;letter-spacing:.06em;font-weight:900">ЧАСТЬ 3</span></div>`);
const LEVEL=mk('ui',`<div class="pill" style="left:540px;top:325px;height:62px;padding:0 28px;font-weight:800;font-size:28px;letter-spacing:.06em"></div>`);
const COUNTER=mk('ui',`<div class="pill" style="left:900px;top:325px;height:62px;padding:0 22px;font-weight:900;font-size:30px;color:${BLUE}"></div>`);
const TIMER=mk('ui',`<div class="abs" style="left:150px;top:1420px;width:124px;height:124px;transform:translate(-50%,-50%)"><svg width="124" height="124" viewBox="-62 -62 124 124"><circle r="56" fill="#fff"/><circle r="47" fill="none" stroke="#e7eaf1" stroke-width="10"/><path id="arc" fill="none" stroke-width="10" stroke-linecap="round"/></svg><div id="tnum" class="abs" style="inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:56px"></div></div>`);
const ANS=mk('ui',`<div class="pill" style="left:540px;top:1420px;height:118px;padding:0 54px;border-radius:40px;font-weight:900;font-size:72px;letter-spacing:.01em;transform-origin:50% 50%"></div>`);
const CTA=mk('ui',`<div class="pill" style="left:540px;top:1510px;height:110px;padding:0 48px;border-radius:40px;font-weight:900;font-size:64px;letter-spacing:-.01em;gap:.3em">ТВОЙ ОТВЕТ? <span id="arw" style="display:inline-block;color:${BLUE}">↓</span></div>`);
const SUB=mk('ui',`<div class="abs" style="left:540px;top:1660px;transform:translate(-50%,-50%);padding:16px 36px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 16px 34px -16px rgba(10,20,40,.55);font-weight:700;font-size:40px;text-align:center;white-space:nowrap"></div>`);
const pillT=(el,x,y,o,s=1,dy=0)=>{el.style.transform=`translate(-50%,-50%) translateY(${dy}px) scale(${s})`;vis(el,o)};
// kinetic subtitles: words spread over each VO window by length (replaced by measured timings once the voice is recorded)
const WORDS=[];VO.forEach(([a,b,txt],li)=>{const ws=txt.split(' '),wt=ws.map(w=>w.length+3),T=wt.reduce((s,v)=>s+v,0);let t=a;ws.forEach((w,i)=>{WORDS.push({txt:w,t,li,key:/^(девять|пять|готов\?|сложнее\.|три\.|одна\.|назовёшь\?|комментариях\.)/i.test(w)});t+=(b-a)*wt[i]/T})});
const CH=[];{let cur=[];WORDS.forEach((w,i)=>{cur.push(w);const nx=WORDS[i+1];if(/[.?!,]$/.test(w.txt)||cur.length>=5||!nx||nx.li!==w.li){CH.push(cur);cur=[]}})}
CH.forEach((c,i)=>{const nx=CH[i+1];c.t0=c[0].t;c.t1=nx&&nx[0].li===c[0].li?nx[0].t-.02:VO[c[0].li][1]+.35});
const lc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),LB=[157,182,234],NV=[43,58,103],BK=[17,18,24],BLc=[47,123,245],GR=[150,156,170];
const eb=p=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function renderSub(t){const c=CH.find(c=>t>=c.t0-.01&&t<c.t1+.15);if(!c){vis(SUB,0);return}const ex=clamp((t-c.t1)/.15);vis(SUB,1-ex*.9);
  SUB.innerHTML=c.filter(w=>t>=w.t).map(w=>{const p=clamp((t-w.t)/.28),q=clamp((t-w.t-.28)/.25);let col=w.key?lc(LB,BLc,p):p<1?lc(LB,NV,p):lc(NV,BK,q);if(ex>0)col=lc(col,GR,ex);const s=w.key?(.6+.4*eb(p))*1.08:1;
    return `<span style="display:inline-block;margin:0 ${w.key?'.3em':'.1em'};color:rgb(${col});opacity:${Math.min(1,p*1.6)};filter:blur(${((1-p)*8+ex*5).toFixed(2)}px);transform:translateY(${((1-p)*18).toFixed(1)}px) scale(${s.toFixed(3)});${w.key?'font-weight:900':''}">${w.txt}</span>`}).join(' ')}
// 8-frame text-in (opacity 0→1, scale .96→1, ease-out), last 12 frames out
const textIn=(t,t0,dur)=>{if(t<t0||t>=t0+dur)return {o:0,s:1};const a=eo(seg(t,t0,t0+8/FPS)),b=1-seg(t,t0+dur-12/FPS,t0+dur);return {o:a*b,s:.96+.04*a}};

// ───────── globe (WebGL orthographic, NASA Blue Marble texture) + d3 borders; used for the intro and every map change
const GL=$('glc').getContext('webgl',{preserveDrawingBuffer:true,antialias:true});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;uniform sampler2D tex;uniform sampler2D det;uniform vec2 C;uniform float R;uniform vec2 L;
uniform vec3 DG;uniform vec2 DS;uniform float DON;   // detail mosaic: world px, X0 px, Y0 px; mosaic size; on/off
void main(){vec2 q=(gl_FragCoord.xy-C)/R;float r2=dot(q,q);vec3 bg=vec3(.024,.094,.165);
  if(r2>1.){float d=sqrt(r2)-1.;float g=exp(-d*R/38.)*.55+exp(-d*R/140.)*.18;gl_FragColor=vec4(bg+vec3(.35,.6,1.)*g,1.);return;}
  vec3 v=vec3(q.x,q.y,sqrt(1.-r2));float cl=cos(L.y),sl=sin(L.y);vec3 w=vec3(v.x,v.y*cl+v.z*sl,-v.y*sl+v.z*cl);
  float lon=atan(w.x,w.z)+L.x,lat=asin(clamp(w.y,-1.,1.));float fx=fract(lon/6.2831853+.5);vec2 uv=vec2(fx,.5-lat/3.1415927);
  vec3 c=texture2D(tex,uv).rgb;
  if(DON>0.){float ym=log(tan(.78539816+clamp(lat,-1.47,1.47)*.5));vec2 d=vec2((fx*DG.x-DG.y)/DS.x,((1.-ym/3.1415927)*.5*DG.x-DG.z)/DS.y);
    float wg=smoothstep(0.,.02,d.x)*smoothstep(0.,.02,1.-d.x)*smoothstep(0.,.02,d.y)*smoothstep(0.,.02,1.-d.y);c=mix(c,texture2D(det,d).rgb,wg*DON);}
  c*=1.08;float limb=pow(v.z,.35);c=c*(.55+.45*limb)+vec3(.3,.55,1.)*pow(1.-v.z,3.)*.55;gl_FragColor=vec4(c,1.);}`;
const sh=(t,src)=>{const o=GL.createShader(t);GL.shaderSource(o,src);GL.compileShader(o);if(!GL.getShaderParameter(o,GL.COMPILE_STATUS))throw new Error(GL.getShaderInfoLog(o));return o};
const PG=GL.createProgram();GL.attachShader(PG,sh(GL.VERTEX_SHADER,VS));GL.attachShader(PG,sh(GL.FRAGMENT_SHADER,FS));GL.linkProgram(PG);GL.useProgram(PG);
GL.bindBuffer(GL.ARRAY_BUFFER,GL.createBuffer());GL.bufferData(GL.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),GL.STATIC_DRAW);
const aP=GL.getAttribLocation(PG,'p');GL.enableVertexAttribArray(aP);GL.vertexAttribPointer(aP,2,GL.FLOAT,false,0,0);
const U={C:GL.getUniformLocation(PG,'C'),R:GL.getUniformLocation(PG,'R'),L:GL.getUniformLocation(PG,'L'),DG:GL.getUniformLocation(PG,'DG'),DS:GL.getUniformLocation(PG,'DS'),DON:GL.getUniformLocation(PG,'DON'),tex:GL.getUniformLocation(PG,'tex'),det:GL.getUniformLocation(PG,'det')};
GL.uniform1i(U.tex,0);GL.uniform1i(U.det,1);
const TEX=new Image();TEX.src=GLOBE_SRC;   // data URL: WebGL refuses file:// textures as cross-origin
TEX.onload=()=>{GL.activeTexture(GL.TEXTURE0);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,TEX);
  GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_MIN_FILTER,GL.LINEAR);GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_MAG_FILTER,GL.LINEAR);
  GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_WRAP_S,GL.CLAMP_TO_EDGE);GL.texParameteri(GL.TEXTURE_2D,GL.TEXTURE_WRAP_T,GL.CLAMP_TO_EDGE)};
const C50=topojson.feature(WORLD50,WORLD50.objects.countries).features.filter(c=>c.id!=='010'),MESH50=topojson.mesh(WORLD50,WORLD50.objects.countries,(a,b)=>a!==b);
const GPR=d3.geoOrthographic().clipAngle(90).precision(.5),GPATH=d3.geoPath(GPR);
const DETIMG={},DETTEX={};Object.keys(DET_SRC).forEach(k=>{const im=new Image();im.src=DET_SRC[k];DETIMG[k]=im});
function bindDet(k){if(!k){GL.uniform1f(U.DON,0);return}
  if(!DETTEX[k]){GL.activeTexture(GL.TEXTURE1);const t=GL.createTexture();GL.bindTexture(GL.TEXTURE_2D,t);GL.texImage2D(GL.TEXTURE_2D,0,GL.RGB,GL.RGB,GL.UNSIGNED_BYTE,DETIMG[k]);
    [GL.TEXTURE_MIN_FILTER,GL.TEXTURE_MAG_FILTER].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.LINEAR));[GL.TEXTURE_WRAP_S,GL.TEXTURE_WRAP_T].forEach(p=>GL.texParameteri(GL.TEXTURE_2D,p,GL.CLAMP_TO_EDGE));DETTEX[k]=t}
  GL.activeTexture(GL.TEXTURE1);GL.bindTexture(GL.TEXTURE_2D,DETTEX[k]);GL.activeTexture(GL.TEXTURE0);
  const r=DET_REF[k];GL.uniform3f(U.DG,256*2**r.z,r.X0*256,r.Y0*256);GL.uniform2f(U.DS,r.W,r.H);GL.uniform1f(U.DON,1)}
// globe framing per country: fit the brief's framing box into the map area (80 %), centre on the box
const myInv=y=>Math.atan(Math.sinh(y*Math.PI/180))*180/Math.PI;
const GV={};Object.entries(VIEWS).forEach(([k,v])=>{const [x0,x1,y0,y1]=v.bbox,la0=myInv(y0),la1=myInv(y1),pts=[];
  for(let i=0;i<=24;i++){const f=i/24;pts.push([lerp(x0,x1,f),la0],[lerp(x0,x1,f),la1],[x0,lerp(la0,la1,f)],[x1,lerp(la0,la1,f)])}
  const lon=(x0+x1)/2,lat=(la0+la1)/2,cy=v.sy||855,hh=k==='canada'?640:440;
  const pr=d3.geoOrthographic().rotate([-lon,-lat]).fitExtent([[540-470,cy-hh],[540+470,cy+hh]],{type:'MultiPoint',coordinates:pts});
  GV[k]={lon,lat,R:pr.scale(),tx:pr.translate()[0],ty:pr.translate()[1]}});
const MESH10=topojson.mesh(WORLD10,WORLD10.objects.countries,(a,b)=>a!==b),SVGC={};
const hlSvg=(d,o)=>`<g opacity="${o}"><path d="${d}" fill="${BLUE}" fill-opacity=".34"/><path d="${d}" fill="none" stroke="#7fb2ff" stroke-width="14" stroke-opacity=".45" stroke-linejoin="round" style="filter:blur(5px)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/></g>`;
function drawGlobe(lon,lat,R,hl,o={}){const tx=o.tx??540,ty=o.ty??855;
  GL.viewport(0,0,1080,1920);GL.uniform2f(U.C,tx,1920-ty);GL.uniform1f(U.R,R);GL.uniform2f(U.L,lon*Math.PI/180,lat*Math.PI/180);bindDet(o.det);GL.drawArrays(GL.TRIANGLE_STRIP,0,4);
  if(o.cache&&SVGC[o.cache]){$('gls').innerHTML=SVGC[o.cache];return}
  GPR.rotate([-lon,-lat]).scale(R).translate([tx,ty]);const fine=o.cache!=null;
  const svg=`<path d="${GPATH(fine?MESH10:MESH50)||''}" fill="none" stroke="#fff" stroke-width="1.4" stroke-opacity=".5" stroke-linejoin="round"/>`+hl.filter(h=>h.o>.01).map(h=>{
    const f=(fine?CTRY:C50).find(c=>c.id===VIEWS[h.k].id);return hlSvg(GPATH(f)||'',h.o)}).join('');
  $('gls').innerHTML=svg;if(o.cache)SVGC[o.cache]=svg}
function slerp(a,b,u){const r=Math.PI/180,va=[Math.cos(a[1]*r)*Math.cos(a[0]*r),Math.cos(a[1]*r)*Math.sin(a[0]*r),Math.sin(a[1]*r)],vb=[Math.cos(b[1]*r)*Math.cos(b[0]*r),Math.cos(b[1]*r)*Math.sin(b[0]*r),Math.sin(b[1]*r)];
  const d=Math.acos(clamp(va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2],-1,1));if(d<1e-6)return a;const s1=Math.sin((1-u)*d)/Math.sin(d),s2=Math.sin(u*d)/Math.sin(d);
  const v=va.map((x,i)=>x*s1+vb[i]*s2);return [Math.atan2(v[1],v[0])/r,Math.asin(clamp(v[2],-1,1))/r]}
const CUTS=SCHED.hops.map(h=>({t:h.t1,from:h.from,to:h.to}));   // every map change: slow 2 s globe hop ending on the new map
const INTRO=2.4;   // opening: globe swings round and dives into Canada
let curMap=null;
function renderAt(t){
  t=Math.min(t,DUR-1e-6);
  // map: hard cut on scene boundaries, static otherwise
  const cut=CUTS.find(c=>t>=c.t-HOP&&t<c.t);
  if(t<INTRO){   // intro: wide globe swings round and dives into Canada, then holds
    const p=eio(seg(t,.35,INTRO)),G=GV.canada,c=slerp([-40,22],[G.lon,G.lat],p),Rr=Math.exp(lerp(Math.log(430),Math.log(G.R),Math.pow(p,1.6)));
    drawGlobe(c[0]-14*(1-seg(t,0,.35)),c[1],Rr,[{k:'canada',o:eo(seg(t,.2,.9))}],{tx:lerp(540,G.tx,p),ty:lerp(855,G.ty,p),det:p>.55?'canada':null})}
  else if(cut){const u=seg(t,cut.t-HOP,cut.t),e=eio(u),A=GV[cut.from],B=GV[cut.to],c=slerp([A.lon,A.lat],[B.lon,B.lat],e);
    const la=Math.log(A.R),lb=Math.log(B.R),dip=Math.max(0,(la+lb)/2-Math.log(470));
    drawGlobe(c[0],c[1],Math.exp(lerp(la,lb,e)-dip*Math.sin(Math.PI*e)),[{k:cut.from,o:1-seg(u,.1,.35)},{k:cut.to,o:seg(u,.62,.88)}],
      {tx:lerp(A.tx,B.tx,e),ty:lerp(A.ty,B.ty,e),det:u<.5?cut.from:cut.to})}
  else{const k=MAPS.find(([k,a,b])=>t>=a&&t<b)[0],G=GV[k];drawGlobe(G.lon,G.lat,G.R,[{k,o:1}],{tx:G.tx,ty:G.ty,det:k,cache:k})}
  // title: rises 24 px in 12 frames on the very first frames, then fixed
  const ti=eo(seg(t,0,12/FPS));pillT(TITLE,0,0,ti,1,(1-ti)*24);
  // level pill: EASY fades out 21.00–21.10, MEDIUM in at 23.2, HARD/FINAL rise 16 px in 12 frames
  let li=0;while(li<LEVELS.length-1&&t>=LEVELS[li+1][0])li++;const L=LEVELS[li];
  LEVEL.innerHTML=L[1].replace(/· (.*)$/,`· <span style="color:${BLUE};margin-left:.3em">$1</span>`);
  let lo=1,ldy=0;if(li===0&&t>=WS)lo=1-seg(t,WS,WS+6/FPS);if(li>0){const nf=li===2?8:12;const p=eo(seg(t,L[0],L[0]+nf/FPS));lo=p;ldy=li===2?0:(1-p)*16}
  pillT(LEVEL,0,0,lo,1,ldy);
  let ci=0;while(ci<COUNT.length-1&&t>=COUNT[ci+1][0])ci++;COUNTER.textContent=COUNT[ci][1]+'/9';pillT(COUNTER,0,0,1);
  // timer: 5 → 1, one second each, arc shrinks evenly over 300 frames
  const th=THINK.find(([a])=>t>=a&&t<a+5);
  if(th){const e=t-th[0],n=5-Math.floor(e),col=n>=4?'#30c060':n>=2?'#f2b705':'#ff3b30',fr=1-e/5,r=47;
    const a1=-Math.PI/2,a2=a1+fr*2*Math.PI,large=fr>.5?1:0;$('arc').setAttribute('d',fr>.999?`M0 ${-r} A${r} ${r} 0 1 1 -0.01 ${-r}`:`M0 ${-r} A${r} ${r} 0 ${large} 1 ${(r*Math.cos(a2)).toFixed(2)} ${(r*Math.sin(a2)).toFixed(2)}`);
    $('arc').setAttribute('stroke',col);$('tnum').textContent=n;$('tnum').style.color=col==='#f2b705'?'#c99400':col;vis(TIMER,1)}else vis(TIMER,0);
  // answers / transition texts (same slot)
  let txt='',q={o:0,s:1};
  for(const [a,d,name] of REVEAL)if(t>=a&&t<a+d){txt=name;q=textIn(t,a,d)}
  if(t>=WS&&t<WS+2){txt='РАЗМИНКА ОКОНЧЕНА';q=textIn(t,WS,2)}
  if(t>=RS&&t<RS+3){txt='<span style="font-size:.86em">8 ПОЗАДИ. <span style="color:'+BLUE+';margin-left:.3em">ОСТАЛАСЬ 1</span></span>';q=textIn(t,RS,3)}
  if(txt){ANS.innerHTML=txt;pillT(ANS,0,0,q.o,q.s)}else vis(ANS,0);
  // CTA
  if(t>=CS){const p=eo(seg(t,CS,CS+12/FPS));pillT(CTA,0,0,p,1,(1-p)*16);const b=seg(t,CS+.2,CS+.6);$('arw').style.transform=`translateY(${Math.sin(Math.PI*b)*6}px)`}else vis(CTA,0);
  renderSub(t);
}
// ───────── sound events (frame-exact)
const SFX=[];const sx=(t,type,g=1)=>SFX.push({t:+t.toFixed(4),f:Math.round(t*FPS),type,g});
sx(0,'impact',.8);THINK.forEach(([a],k)=>{for(let i=0;i<5;i++)sx(a+i,'tick',k===8&&i===4?.55:.6,)});REVEAL.forEach(([a])=>sx(a-.07,'ding',.6));
SCHED.hops.forEach(h=>sx(h.t0,'hop',.5));sx(.3,'hop',.45);sx(WS,'tapestop',.7);sx(HS-.6,'riser',.4);sx(HS,'impact',.7);sx(FSq,'impact',.6);sx(CS,'pop',.6);
window.SFX=SFX;window.SCN=SCHED;window.VO=VO;window.renderAt=renderAt;window.DUR=DUR;
(TEX.complete?Promise.resolve():new Promise(r=>TEX.addEventListener('load',r))).then(()=>Promise.all([...document.images,...Object.values(DETIMG)].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r}))).then(()=>document.fonts.ready)).then(()=>{renderAt(0);window.ready=true});
</script>
